<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>5-4 트럭 부품 보상 자산 전수표</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 1400px; height: 920px; margin: 0; overflow: hidden; }
    body { padding: 28px; color: #fff8e8; background: #151223; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; }
    h1 { margin: 0 0 8px; font-size: 30px; }
    p { margin: 0 0 20px; color: #c9c4d8; font-size: 16px; }
    main { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
    figure { margin: 0; padding: 12px; border: 1px solid #58516e; border-radius: 18px; background: #211d32; }
    img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 12px; }
    figcaption { display: grid; gap: 3px; margin-top: 8px; text-align: center; font-size: 16px; font-weight: 800; }
    code { color: #8debd5; font-size: 12px; }
  </style>
</head>
<body>
  <h1>5단원 4차시 · 트럭 부품 보상 자산 전수표</h1>
  <p>계약: 닫힘 1장 + 사건 6장 · 각 512×512 · 실제 슬롯 250×250 · 글자/숫자/UI 없음</p>
  <main>
    <figure><img src="reward-event-closed-v2-generated.webp" alt=""><figcaption>닫힌 상자<code>closed-v2 · 512×512</code></figcaption></figure>
    <figure><img src="reward-event-normal-generated.webp" alt=""><figcaption>작은 상승<code>normal · 512×512</code></figcaption></figure>
    <figure><img src="reward-event-loss-generated.webp" alt=""><figcaption>감소·수리<code>loss · 512×512</code></figcaption></figure>
    <figure><img src="reward-event-mega-generated.webp" alt=""><figcaption>큰 상승<code>mega · 512×512</code></figcaption></figure>
    <figure><img src="reward-event-jackpot-generated.webp" alt=""><figcaption>+30 부품<code>jackpot · 512×512</code></figcaption></figure>
    <figure><img src="reward-event-empty-generated.webp" alt=""><figcaption>변화 없음<code>empty · 512×512</code></figcaption></figure>
    <figure><img src="reward-event-special-generated.webp" alt=""><figcaption>특별 부품<code>special · 512×512</code></figcaption></figure>
  </main>
</body>
</html>
