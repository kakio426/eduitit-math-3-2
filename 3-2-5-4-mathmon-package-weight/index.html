<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>매스몬 택배 무게 맞추기 | 에듀잇티 수학 게임</title>
  <style>
    :root {
      --page: #111018;
      --panel: #201a2d;
      --panel-soft: #2b243a;
      --ink: #fff8e8;
      --muted: #d7cadb;
      --line: rgba(255, 255, 255, 0.16);
      --mint: #35d9b2;
      --amber: #ffc857;
      --rose: #ff5d7a;
      --sky: #60d7ff;
      --violet: #b88cff;
      --deep: #0e0c16;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--page);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100dvh;
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 12%, rgba(96, 215, 255, 0.18), transparent 30%),
        linear-gradient(135deg, #111018 0%, #1f1930 52%, #0e0c16 100%);
    }

    button {
      font: inherit;
    }

    .game {
      --stage-padding: clamp(10px, 2vw, 24px);
      min-height: 100dvh;
      padding: var(--stage-padding);
      display: grid;
      place-items: center;
    }

    .stage-shell {
      --stage-inset: clamp(14px, 2vw, 22px);
      --sound-button-size: clamp(42px, 3.6vw, 46px);
      --sound-gap: clamp(8px, 1vw, 12px);
      --sound-reserve: calc(var(--sound-button-size) + var(--sound-gap));
      --top-control-y: var(--stage-inset);
      --top-control-pad-x: 9px;
      --top-control-icon-gap: 7px;
      position: relative;
      width: min(1280px, calc((100dvh - 48px) * 1.6), 100%);
      aspect-ratio: 16 / 10;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background:
        linear-gradient(135deg, rgba(53, 217, 178, 0.16), transparent 34%),
        linear-gradient(160deg, #2a2140 0%, #171321 58%, #0e0c16 100%);
      box-shadow: 0 24px 72px rgba(0, 0, 0, 0.32);
    }

    .screen {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      min-height: auto;
      aspect-ratio: 16 / 10;
      display: none;
      padding: calc(var(--stage-inset) + 52px) var(--stage-inset) var(--stage-inset);
    }

    .screen.is-active {
      display: block;
    }

    .top-row {
      position: absolute;
      top: var(--top-control-y);
      left: var(--stage-inset);
      right: calc(var(--stage-inset) + var(--sound-reserve));
      height: var(--sound-button-size);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--sound-gap);
      z-index: 5;
      pointer-events: none;
    }

    .brand-badge,
    .unit-badge,
    .mini-badge {
      flex: 0 0 auto;
      width: fit-content;
      max-width: max-content;
      min-height: var(--sound-button-size);
      padding: 0 var(--top-control-pad-x);
      gap: var(--top-control-icon-gap);
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(14, 12, 22, 0.58);
      color: var(--ink);
      font-size: 0.82rem;
      font-weight: 900;
      line-height: 1;
      pointer-events: auto;
    }

    .brand-badge img {
      width: 18px;
      height: 18px;
      margin-right: 0;
      border-radius: 50%;
      object-fit: contain;
      display: block;
    }

    .badge-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--mint);
      box-shadow: 0 0 0 3px rgba(53, 217, 178, 0.14);
    }

    .unit-badge .badge-dot {
      background: var(--sky);
      box-shadow: 0 0 0 3px rgba(96, 215, 255, 0.14);
    }

    .topic-badge {
      position: absolute;
      left: var(--stage-inset);
      bottom: var(--stage-inset);
      z-index: 4;
      color: #2b2100;
      background: var(--amber);
      border: 0;
    }

    .stage-shell .top-row {
      right: calc(var(--stage-inset) + var(--sound-reserve));
    }

    .stage-shell .hud {
      padding-right: var(--sound-reserve);
    }

    .settings-toggle {
      position: absolute;
      top: var(--top-control-y);
      right: var(--stage-inset);
      width: var(--sound-button-size);
      height: var(--sound-button-size);
      font-size: 0;
      z-index: 50;
      border: 1px solid rgba(255, 255, 255, 0.34);
      border-radius: 999px;
      color: var(--ink);
      background: rgba(14, 12, 22, 0.58);
      backdrop-filter: blur(12px);
      display: grid;
      place-items: center;
      cursor: pointer;
    }

    .settings-toggle::before,
    .settings-toggle::after {
      content: "";
    }

    .settings-toggle svg {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 18px;
      height: 18px;
      transform: translate(-50%, -50%);
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .settings-toggle[aria-expanded="true"] {
      background: rgba(53, 217, 178, 0.34);
    }

    .settings-toggle:focus-visible,
    .settings-switch:focus-visible,
    .settings-action:focus-visible {
      outline: 3px solid var(--amber);
      outline-offset: 3px;
    }

    .settings-backdrop {
      position: absolute;
      inset: 0;
      z-index: 60;
      display: grid;
      place-items: center;
      background: rgba(0, 0, 0, 0.38);
      backdrop-filter: blur(6px);
    }

    .settings-backdrop[hidden] {
      display: none;
    }

    .settings-modal {
      width: min(410px, 86%);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 18px;
      background: rgba(32, 26, 45, 0.96);
      padding: 22px;
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.48);
    }

    .settings-title {
      margin: 0 0 14px;
      font-size: 1.38rem;
      font-weight: 1000;
    }

    .settings-menu,
    .settings-confirm {
      display: grid;
      gap: 10px;
    }

    .settings-menu[hidden],
    .settings-confirm[hidden] {
      display: none;
    }

    .settings-switch,
    .settings-action {
      min-height: 48px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 14px;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.08);
      padding: 0 14px;
      font-weight: 950;
      cursor: pointer;
    }

    .settings-switch {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .settings-switch-track {
      position: relative;
      flex: 0 0 auto;
      width: 46px;
      height: 26px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.22);
    }

    .settings-switch-track::after {
      content: "";
      position: absolute;
      left: 4px;
      top: 4px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--ink);
      transition: transform 180ms ease;
    }

    .settings-switch[aria-checked="true"] .settings-switch-track {
      background: var(--mint);
    }

    .settings-switch[aria-checked="true"] .settings-switch-track::after {
      transform: translateX(20px);
    }

    .settings-action.is-danger {
      color: #ffd6de;
      border-color: rgba(255, 93, 122, 0.42);
    }

    .settings-confirm-title {
      margin: 0 0 8px;
      font-size: 1.1rem;
      font-weight: 1000;
    }

    .settings-confirm-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .primary-button,
    .secondary-button,
    .choice-button {
      border: 0;
      border-radius: 8px;
      font-weight: 1000;
      letter-spacing: 0;
      cursor: pointer;
      transition: opacity 160ms ease, filter 160ms ease, transform 160ms ease;
    }

    .primary-button:hover,
    .secondary-button:hover,
    .choice-button:hover {
      filter: brightness(1.05);
    }

    .primary-button:active,
    .secondary-button:active,
    .choice-button:active {
      transform: translateY(1px);
    }

    .primary-button {
      min-width: 190px;
      min-height: 72px;
      padding: 0 44px;
      background: var(--amber);
      color: #231900;
      font-size: 1.32rem;
      box-shadow: 0 14px 28px rgba(255, 200, 87, 0.22);
    }

    .secondary-button {
      min-height: 54px;
      padding: 0 24px;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid var(--line);
    }

    .cover {
      padding: 0;
      isolation: isolate;
    }

    .cover::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(14, 12, 22, 0.12), rgba(14, 12, 22, 0.78)),
        repeating-linear-gradient(115deg, rgba(255, 255, 255, 0.08) 0 2px, transparent 2px 76px);
      z-index: -1;
    }

    .raster-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      user-select: none;
      pointer-events: none;
    }

    .cover::before {
      z-index: 1;
    }

    .cover-scene {
      position: relative;
      z-index: 2;
      height: 100%;
      display: flex;
      align-items: center;
      padding: 92px 58px 76px;
    }

    .hero-copy {
      width: min(640px, 56%);
      display: grid;
      justify-items: start;
      gap: 20px;
    }

    .hero-title-art {
      display: block;
      width: min(620px, 100%);
      height: auto;
      filter: drop-shadow(0 16px 24px rgba(0, 0, 0, 0.34));
    }

    .cover-goal {
      width: fit-content;
      max-width: 100%;
      margin: 0;
      padding: 12px 18px;
      border-radius: 8px;
      font-size: clamp(1.06rem, 2vw, 1.32rem);
      line-height: 1.35;
      font-weight: 950;
      color: var(--ink);
      background: rgba(14, 12, 22, 0.66);
      border: 1px solid var(--line);
    }

    .cover-start-button {
      width: clamp(300px, 28.125vw, 360px);
      aspect-ratio: 1611 / 680;
      height: auto;
      padding: 0;
      border: 0;
      border-radius: 999px;
      background: transparent;
      cursor: pointer;
      display: inline-grid;
      place-items: center;
      transition: filter 160ms ease, transform 160ms ease;
      filter: drop-shadow(0 14px 24px rgba(255, 174, 34, 0.22));
    }

    .cover-start-button:hover {
      filter: brightness(1.04) drop-shadow(0 16px 26px rgba(255, 174, 34, 0.26));
      transform: translateY(-1px);
    }

    .cover-start-button:active {
      filter: brightness(0.99) drop-shadow(0 10px 18px rgba(255, 174, 34, 0.2));
      transform: translateY(1px);
    }

    .cover-start-button:focus-visible {
      outline: 4px solid rgba(96, 215, 255, 0.9);
      outline-offset: 5px;
    }

    .start-button-art {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      user-select: none;
    }

    .tutorial-grid {
      height: 100%;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 24px;
      align-items: center;
    }

    .screen-title {
      margin: 0;
      font-size: clamp(1.8rem, 3.2vw, 2.8rem);
      line-height: 1.05;
      font-weight: 1000;
      text-align: center;
    }

    .tutorial-cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .tutorial-card {
      min-height: 260px;
      padding: 24px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.08);
      display: grid;
      align-content: center;
      justify-items: center;
      text-align: center;
      gap: 14px;
    }

    .card-mark {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #10251f;
      background: var(--mint);
      font-size: 1.8rem;
      font-weight: 1000;
    }

    .tutorial-card strong {
      display: block;
      font-size: 1.32rem;
      line-height: 1.25;
    }

    .tutorial-card p {
      margin: 0;
      color: var(--muted);
      font-weight: 850;
      line-height: 1.35;
    }

    .tutorial-action {
      display: flex;
      justify-content: center;
    }

    .game[data-tutorial-mode="poster-two-step"] .tutorial {
      padding: 0;
    }

    .game[data-tutorial-mode="poster-two-step"] .tutorial-grid,
    .game[data-tutorial-mode="poster-two-step"] .tutorial-cards,
    .game[data-tutorial-mode="poster-two-step"] .tutorial-card {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      display: block;
    }

    .game[data-tutorial-mode="poster-two-step"] .tutorial-card[hidden] {
      display: none;
    }

    .tutorial-poster-art {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .game[data-tutorial-mode="poster-two-step"] .tutorial .screen-title,
    .game[data-tutorial-mode="poster-two-step"] .tutorial-card .tutorial-semantic {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    .game[data-tutorial-mode="poster-two-step"] .tutorial-action {
      position: absolute;
      inset: 0;
      z-index: 8;
      pointer-events: none;
    }

    .game[data-tutorial-mode="poster-two-step"] .tutorial-action button {
      position: absolute;
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
      color: transparent;
      box-shadow: none;
      pointer-events: auto;
    }

    .game[data-tutorial-mode="poster-two-step"] #tutorialStartButton {
      left: 438px;
      bottom: 38px;
      width: 404px;
      height: 118px;
    }

    .game[data-tutorial-mode="poster-two-step"] #tutorialBackButton {
      display: none;
      left: 96px;
      bottom: 42px;
      width: 300px;
      height: 110px;
    }

    .game[data-tutorial-mode="poster-two-step"] #screen-tutorial[data-page="1"] #tutorialStartButton {
      left: auto;
      right: 96px;
      width: 300px;
      height: 110px;
    }

    .game[data-tutorial-mode="poster-two-step"] #screen-tutorial[data-page="1"] #tutorialBackButton {
      display: block;
    }

    .play {
      padding: var(--stage-inset);
      display: none;
    }

    .play.is-active {
      display: block;
    }

    .hud {
      position: absolute;
      top: var(--top-control-y);
      left: var(--stage-inset);
      right: var(--stage-inset);
      height: var(--sound-button-size);
      z-index: 8;
      display: flex;
      align-items: start;
      justify-content: space-between;
      min-height: var(--sound-button-size);
      gap: 12px;
    }

    .hud-left,
    .hud-right {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .progress-line {
      position: absolute;
      top: 11%;
      left: 1.65%;
      z-index: 4;
      width: 19.2%;
      height: 84%;
      min-width: 0;
      max-width: none;
      margin: 0;
      padding: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      border: 3px solid rgba(96, 215, 255, .92);
      border-radius: 22px;
      background: #102839;
      box-shadow: 0 16px 34px rgba(10, 43, 65, .4), inset 0 0 0 1px rgba(255, 249, 220, .22);
    }

    .progress-readout {
      flex: 1 1 auto;
      min-height: 0;
      padding: 9px 12px 12px;
      display: grid;
      align-content: center;
      justify-items: center;
      gap: 7px;
      border-top: 2px solid rgba(96, 215, 255, .68);
      background: linear-gradient(180deg, rgba(25, 78, 107, .98), rgba(14, 45, 64, .99));
    }

    .progress-eyebrow {
      color: #dff8ff;
      font-size: clamp(.68rem, 1vw, .78rem);
      line-height: 1.2;
      font-weight: 900;
      text-align: center;
    }

    .progress-text {
      max-width: 100%;
      color: #ffe19e;
      font-size: clamp(.94rem, 1.45vw, 1.16rem);
      line-height: 1.2;
      text-align: center;
      font-weight: 1000;
      word-break: keep-all;
      text-shadow: 0 2px 0 #4c3b1a;
    }

    .progress-meter {
      width: 100%;
      height: 9px;
      overflow: hidden;
      display: block;
      border: 1px solid rgba(231, 252, 255, .82);
      border-radius: 999px;
      background: rgba(5, 23, 34, .92);
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      display: block;
      border-radius: inherit;
      background: linear-gradient(90deg, #56dfff, #35d9b2, #ffd263);
      box-shadow: 0 0 10px rgba(91, 222, 255, .76);
      transition: width .62s cubic-bezier(.2, .8, .2, 1);
    }

    .run-truck-image {
      width: 100%;
      height: auto;
      aspect-ratio: 1 / 2;
      flex: 0 0 auto;
      min-height: 0;
      display: block;
      object-fit: contain;
      object-position: center;
      background: #0d2333;
      transition: filter .42s ease, transform .52s ease, opacity .28s ease;
    }
    .progress-line.is-upgraded .run-truck-image { animation: truck-arrive 1.2s cubic-bezier(.2,.85,.25,1.12); filter: drop-shadow(0 0 15px rgba(255,200,87,.85)); }
    .progress-line.is-changing .run-truck-image { animation: progress-brighten 1.56s cubic-bezier(.2,.82,.22,1) both; }
    .progress-line.is-dimming .run-truck-image { animation: progress-dim 1.56s ease both; }
    .progress-line.is-celebrating { animation: progress-impact 1.56s cubic-bezier(.18,.78,.2,1) both; }
    .progress-line.is-tier-up { animation: progress-tier-rise 1.56s cubic-bezier(.18,.78,.2,1) both; }

    .progress-impact-stage {
      position: absolute;
      top: 4%;
      left: -1%;
      z-index: 5;
      width: 52%;
      height: 92%;
      border-radius: 50%;
      pointer-events: none;
      opacity: 0;
      transform: scale(.62);
      background: radial-gradient(ellipse at 50% 48%, rgba(255,255,255,.98) 0 3%, rgba(90,224,255,.68) 13%, rgba(255,205,88,.45) 31%, rgba(56,169,230,.24) 48%, transparent 71%);
      filter: drop-shadow(0 0 30px rgba(87, 219, 255, .9));
      mix-blend-mode: screen;
    }
    .progress-impact-stage::before,
    .progress-impact-stage::after {
      content: "";
      position: absolute;
      inset: 8% 4%;
      border-radius: 50%;
      pointer-events: none;
    }
    .progress-impact-stage::before {
      border: 5px solid rgba(225, 251, 255, .94);
      box-shadow: 0 0 20px 6px rgba(94, 221, 255, .72), 0 0 58px 20px rgba(255, 196, 74, .62), inset 0 0 36px rgba(91, 213, 255, .62);
    }
    .progress-impact-stage::after {
      inset: -4%;
      background: repeating-conic-gradient(from 4deg, transparent 0 7deg, rgba(238, 253, 255, .72) 8deg 9deg, transparent 10deg 21deg);
      -webkit-mask-image: radial-gradient(circle, transparent 0 30%, #000 43% 61%, transparent 76%);
      mask-image: radial-gradient(circle, transparent 0 30%, #000 43% 61%, transparent 76%);
    }
    .progress-impact-stage.is-active { animation: progress-stage-impact 1.56s cubic-bezier(.12,.76,.18,1) both; }
    @keyframes truck-arrive { 0% { transform: translateX(-18px) scale(.82); opacity: .35; } 70% { transform: translateX(4px) scale(1.09); opacity: 1; } 100% { transform: none; opacity: 1; } }
    @keyframes progress-brighten { 0% { filter: brightness(.72); } 34% { filter: brightness(1.62) saturate(1.42); transform: scale(1.025); } 100% { filter: brightness(1); transform: none; } }
    @keyframes progress-dim { 0%, 100% { filter: brightness(1); transform: translateX(0); } 34% { filter: brightness(.52) saturate(.52); transform: translateX(-4px); } }
    @keyframes progress-impact { 0%, 100% { transform: scale(1); } 26% { transform: scale(1.025); } 52% { transform: scale(.992); } }
    @keyframes progress-tier-rise { 0% { box-shadow: 0 16px 34px rgba(10,43,65,.4); } 38% { box-shadow: 0 0 48px 18px rgba(255,214,98,.78); transform: scale(1.025); } 100% { transform: none; } }
    @keyframes progress-stage-impact { 0% { opacity: 0; transform: scale(.62); } 18% { opacity: .98; } 58% { opacity: .7; transform: scale(1.12); } 100% { opacity: 0; transform: scale(1.28); } }

    .problem-grid {
      position: absolute;
      top: calc(var(--top-control-y) + var(--sound-button-size) + 6px);
      right: 3%;
      bottom: 20px;
      left: 22.5%;
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr);
      grid-template-rows: auto 1fr auto;
      gap: 14px;
      width: auto;
      height: auto;
      margin: 0;
      min-height: 0;
    }

    .problem-card,
    .step-board,
    .choices-panel,
    .complete-panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.09);
    }

    .problem-card {
      grid-column: 1 / 2;
      grid-row: 1 / 3;
      padding: 24px;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 18px;
      min-height: 0;
    }

    .problem-label {
      margin: 0;
      color: var(--sky);
      font-size: 1.125rem;
      font-weight: 950;
    }

    .big-problem {
      display: grid;
      place-items: center;
      text-align: center;
      min-height: 0;
      padding: 18px;
      border-radius: 8px;
      background: rgba(14, 12, 22, 0.46);
      overflow: hidden;
    }

    .problem-expression {
      width: 100%;
      display: grid;
      justify-items: center;
      gap: 10px;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }

    .weight-equation {
      width: min(100%, 460px);
      min-width: 0;
      max-width: 100%;
      display: grid;
      gap: 7px;
    }

    .weight-row {
      width: 100%;
      display: grid;
      grid-template-columns: clamp(28px, 3.4vw, 40px) minmax(0, 1fr);
      align-items: center;
      column-gap: clamp(8px, 1vw, 12px);
    }

    .weight-row.is-first .weight-operator {
      opacity: 0;
    }

    .weight-operator {
      color: var(--amber);
      font-size: clamp(2rem, 4.4vw, 3.35rem);
      font-weight: 1000;
      line-height: 0.95;
      text-align: center;
    }

    .weight-value {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      align-items: center;
      gap: clamp(14px, 2.4vw, 30px);
      white-space: nowrap;
      font-size: clamp(1.9rem, 4.35vw, 3.45rem);
      font-weight: 1000;
      line-height: 0.95;
      font-variant-numeric: tabular-nums;
    }

    .weight-major-slot,
    .weight-minor-slot {
      min-width: 0;
      text-align: right;
    }

    .weight-columns-header {
      min-height: 22px;
    }

    .weight-columns-header .weight-operator {
      opacity: 0;
    }

    .weight-columns-header .weight-value {
      color: var(--sky);
      font-size: clamp(.9rem, 1.55vw, 1.05rem);
      line-height: 1;
    }

    .borrow-annotation-row {
      margin-bottom: -4px;
    }

    .borrow-annotation-row .weight-value {
      color: var(--amber);
      font-size: clamp(1.15rem, 2.4vw, 1.7rem);
      line-height: 1;
    }

    .borrow-annotation-row .weight-major-slot,
    .borrow-annotation-row .weight-minor-slot {
      text-decoration: underline;
      text-decoration-thickness: 2px;
      text-underline-offset: 3px;
    }

    .is-borrowed-source .weight-value {
      color: rgba(255, 248, 232, .68);
    }

    .equation-rule {
      width: 100%;
      height: 4px;
      margin-top: 2px;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(255, 248, 232, 0.26), rgba(255, 200, 87, 0.82));
    }

    .equation-result-row {
      padding-top: 2px;
      color: var(--mint);
    }

    .equation-result-row .weight-operator {
      color: var(--mint);
    }

    .equation-result-note {
      margin: -2px 0 0;
      padding-right: 2px;
      color: var(--sky);
      font-size: clamp(.95rem, 1.7vw, 1.12rem);
      line-height: 1.15;
      font-weight: 950;
      text-align: right;
      word-break: keep-all;
    }

    .limit-expression {
      gap: 10px;
    }

    .limit-cap-row {
      display: inline-flex;
      align-items: baseline;
      justify-content: center;
      gap: 12px;
      color: var(--sky);
      white-space: nowrap;
    }

    .limit-cap-label {
      font-size: clamp(1.15rem, 2.6vw, 1.72rem);
      font-weight: 1000;
    }

    .limit-cap-value {
      font-size: clamp(1.65rem, 3.6vw, 2.8rem);
      font-weight: 1000;
      line-height: 0.98;
    }

    .step-board {
      grid-column: 2 / 3;
      grid-row: 1 / 2;
      padding: 18px;
      display: grid;
      gap: 12px;
    }

    .step-chips {
      display: none;
      gap: 8px;
      flex-wrap: wrap;
      min-height: 32px;
    }

    .step-chip {
      min-height: 32px;
      padding: 0 12px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.08);
      font-size: 0.82rem;
      font-weight: 950;
    }

    .step-chip.is-done {
      color: #10251f;
      background: var(--mint);
    }

    .step-chip.is-current {
      color: #231900;
      background: var(--amber);
    }

    .instruction {
      margin: 0;
      width: 100%;
      text-align: left;
      font-size: clamp(1.3rem, 2.4vw, 1.75rem);
      line-height: 1.12;
      font-weight: 1000;
      word-break: keep-all;
      overflow-wrap: normal;
    }

    .answer-slot {
      min-height: 124px;
      border-radius: 8px;
      border: 2px dashed rgba(255, 255, 255, 0.28);
      display: grid;
      place-items: center;
      padding: 10px 14px;
      color: var(--muted);
      background: rgba(14, 12, 22, 0.38);
      text-align: center;
      font-size: clamp(2.5rem, 5.8vw, 4.25rem);
      font-weight: 1000;
      line-height: 1.1;
      overflow-wrap: anywhere;
    }

    .answer-slot.is-filled {
      color: #10251f;
      background: var(--mint);
      border-color: transparent;
      animation: slotPulse 520ms ease;
    }

    .feedback-line {
      min-height: 26px;
      margin: 0;
      width: 100%;
      text-align: left;
      color: var(--muted);
      font-weight: 900;
      font-size: 1.125rem;
      line-height: 1.25;
    }

    .feedback-line.is-good {
      color: var(--mint);
    }

    .feedback-line.is-wrong {
      color: var(--rose);
    }

    .choices-panel {
      grid-column: 2 / 3;
      grid-row: 2 / 3;
      padding: 16px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      align-content: stretch;
    }

    .choice-button {
      min-height: 86px;
      padding: 12px 16px;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.13);
      border: 1px solid rgba(255, 255, 255, 0.14);
      font-size: clamp(1.125rem, 2.2vw, 1.42rem);
      line-height: 1.16;
      overflow-wrap: anywhere;
    }

    .choice-button.is-correct {
      color: #10251f;
      background: var(--mint);
    }

    .choice-button.is-wrong {
      color: var(--ink);
      background: rgba(255, 93, 122, 0.26);
      border-color: rgba(255, 93, 122, 0.48);
    }

    .choice-button:disabled {
      cursor: default;
      opacity: 0.76;
    }

    .complete-panel {
      grid-column: 1 / 3;
      grid-row: 3 / 4;
      min-height: 88px;
      padding: 12px 16px;
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .complete-panel.is-visible {
      display: flex;
    }

    .problem-grid.is-complete {
      grid-template-rows: auto minmax(0, 1fr);
    }

    .problem-grid.is-complete .choices-panel {
      display: none;
    }

    .problem-grid.is-complete .complete-panel {
      grid-column: 2 / 3;
      grid-row: 2 / 3;
      min-height: 0;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .problem-grid.is-complete .complete-panel .primary-button {
      min-height: 56px;
      width: min(220px, 100%);
      padding: 0 24px;
      font-size: 1.08rem;
    }

    .complete-text {
      margin: 0;
      font-size: clamp(1rem, 2vw, 1.28rem);
      font-weight: 1000;
      line-height: 1.24;
      overflow-wrap: anywhere;
    }

    .complete-text[data-text-align-role="sentence"] {
      width: 100%;
      align-self: stretch;
      text-align: left;
    }

    .complete-text[data-text-align-role="math"] {
      text-align: center;
    }

    .reward,
    .result {
      display: none;
      place-items: center;
      text-align: center;
    }

    .reward.is-active,
    .result.is-active {
      display: grid;
    }

    .reward-card {
      position: relative;
      z-index: 2;
      width: min(760px, 88%);
      border-radius: 8px;
      border: 1px solid var(--line);
      background: rgba(14, 12, 22, 0.72);
      padding: 34px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.28);
    }

    #screen-reward .reward-card {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 560px;
      height: 480px;
      display: grid;
      grid-template-rows: minmax(62px, auto) 250px 60px;
      place-items: center;
      gap: 14px;
      padding: 20px 28px;
      border-radius: 28px;
      background: rgba(14, 12, 22, 0.78);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transform: translate(-50%, -50%);
    }

    #screen-reward {
      z-index: 12;
      background: rgba(8, 10, 18, .58);
    }

    #screen-reward > .top-row {
      display: none;
    }

    #screen-reward .raster-bg {
      display: none;
    }

    #screen-reward .upgrade-label {
      min-height: 62px;
      margin: 0;
      max-width: 500px;
      font-size: clamp(1.45rem, 2.45vw, 2rem);
      line-height: 1.2;
      white-space: normal;
      word-break: keep-all;
      overflow-wrap: normal;
    }

    .reward-visual {
      display: block;
      width: 250px;
      height: 250px;
      object-fit: cover;
      border-radius: 24px;
      border: 2px solid rgba(255, 255, 255, .52);
      box-shadow: 0 16px 38px rgba(0, 0, 0, .34);
    }

    #screen-reward[data-reward-phase="opened"] .reward-visual {
      animation: reward-art-reveal .55s cubic-bezier(.16, .88, .25, 1.12);
    }

    .reward-action-button {
      width: 224px;
      min-height: 60px;
      padding: 0 24px;
      font-size: 1.18rem;
    }

    @keyframes reward-art-reveal {
      from { transform: scale(.84); opacity: .4; }
      to { transform: none; opacity: 1; }
    }

    .upgrade-label {
      min-height: 70px;
      display: grid;
      place-items: center;
      margin: 0 0 18px;
      font-size: clamp(2rem, 4.5vw, 3.6rem);
      line-height: 1.05;
      font-weight: 1000;
      color: var(--amber);
    }

    .truck-preview {
      position: relative;
      min-height: 176px;
      border-radius: 8px;
      overflow: hidden;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 20%, rgba(255, 200, 87, 0.18), transparent 52%),
        rgba(255, 255, 255, 0.08);
      border: 1px solid var(--line);
    }

    .reward-evolution-stage {
      min-height: 286px;
      display: grid;
      grid-template-columns: minmax(0, .82fr) 58px minmax(0, 1.18fr);
      align-items: center;
      gap: 8px;
      padding: 12px 18px;
      border-radius: 26px;
      border: 1px solid rgba(255,255,255,.22);
      background: radial-gradient(circle at 72% 46%, rgba(255,208,89,.38), transparent 34%), rgba(14,12,22,.7);
      overflow: hidden;
    }

    .reward-truck-before,
    .reward-truck-after { width: 100%; max-height: 248px; object-fit: contain; filter: drop-shadow(0 14px 16px rgba(0,0,0,.42)); }
    .reward-truck-before { opacity: .54; transform: scale(.76); filter: grayscale(.35) brightness(.78) drop-shadow(0 10px 12px rgba(0,0,0,.4)); }
    .reward-truck-after { transform: translateX(34px) scale(.72); opacity: 0; }
    .reward-card.is-revealed .reward-truck-after { animation: reward-truck-reveal .78s cubic-bezier(.16,.88,.25,1.15) forwards; }
    .reward-card.is-revealed .reward-truck-before { animation: reward-old-truck .5s ease forwards; }
    .reward-burst { width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; color: #5f3600; background: radial-gradient(circle, #fffbe3 0 22%, #ffc857 24% 55%, #ff8c42 58% 100%); font-size: 2rem; font-weight: 1000; box-shadow: 0 0 28px rgba(255,200,87,.75); animation: reward-burst-pulse .8s ease-in-out infinite alternate; }
    @keyframes reward-truck-reveal { to { transform: none; opacity: 1; } }
    @keyframes reward-old-truck { to { transform: translateX(-18px) scale(.68); opacity: .28; } }
    @keyframes reward-burst-pulse { to { transform: scale(1.13) rotate(6deg); filter: brightness(1.2); } }

    .truck-visual {
      position: relative;
      width: min(440px, 92%);
      height: 126px;
      transform-origin: center bottom;
      transition: transform 420ms ease, filter 420ms ease;
    }

    .truck-body {
      position: absolute;
      left: 112px;
      right: 24px;
      top: 30px;
      height: 62px;
      border-radius: 8px 16px 10px 8px;
      background: linear-gradient(135deg, #ffd15f, #f7a91d);
      border: 3px solid rgba(255, 248, 232, 0.78);
      box-shadow: inset 0 -12px 0 rgba(116, 75, 0, 0.12);
    }

    .truck-cab {
      position: absolute;
      left: 30px;
      top: 42px;
      width: 118px;
      height: 52px;
      border-radius: 34px 12px 10px 12px;
      background: linear-gradient(135deg, #ffe08a, #f5a31c);
      border: 3px solid rgba(255, 248, 232, 0.78);
      box-shadow: inset 0 -10px 0 rgba(116, 75, 0, 0.12);
    }

    .truck-window {
      position: absolute;
      left: 68px;
      top: 50px;
      width: 48px;
      height: 26px;
      border-radius: 12px 8px 7px 8px;
      background: linear-gradient(135deg, #9ce8ff, #3c9ed7);
      border: 2px solid rgba(255, 248, 232, 0.7);
    }

    .truck-wheel {
      position: absolute;
      bottom: 16px;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: radial-gradient(circle, #d9f4ff 0 28%, #263047 30% 58%, #0e0c16 60%);
      border: 3px solid rgba(255, 255, 255, 0.72);
    }

    .truck-wheel.is-front {
      left: 86px;
    }

    .truck-wheel.is-back {
      right: 74px;
    }

    .truck-stripe,
    .truck-light,
    .truck-wing,
    .truck-aura {
      position: absolute;
      opacity: 0;
      pointer-events: none;
      transition: opacity 420ms ease, transform 420ms ease;
    }

    .truck-stripe {
      left: 144px;
      right: 54px;
      top: 54px;
      height: 10px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--mint), var(--sky));
    }

    .truck-light {
      left: 34px;
      bottom: 40px;
      width: 24px;
      height: 12px;
      border-radius: 999px;
      background: #fff3a8;
      box-shadow: 0 0 18px rgba(255, 243, 168, 0.95);
    }

    .truck-wing {
      right: 18px;
      top: 0;
      width: 112px;
      height: 40px;
      border-radius: 80% 18% 60% 18%;
      background: linear-gradient(135deg, #f5f7ff, #78dfff);
      transform: rotate(-10deg);
      box-shadow: 0 0 22px rgba(96, 215, 255, 0.42);
    }

    .truck-aura {
      inset: 10px 0 0;
      border-radius: 999px;
      background: radial-gradient(circle at 50% 58%, rgba(255, 200, 87, 0.36), transparent 55%);
      filter: blur(10px);
    }

    .truck-preview[data-stage="slight"] .truck-stripe,
    .truck-preview[data-stage="slight"] .truck-light,
    .truck-preview[data-stage="cool"] .truck-stripe,
    .truck-preview[data-stage="cool"] .truck-light,
    .truck-preview[data-stage="super"] .truck-stripe,
    .truck-preview[data-stage="super"] .truck-light {
      opacity: 1;
    }

    .truck-preview[data-stage="cool"] .truck-visual,
    .truck-preview[data-stage="super"] .truck-visual {
      transform: scale(1.06);
      filter: saturate(1.12) brightness(1.08);
    }

    .truck-preview[data-stage="cool"] .truck-body,
    .truck-preview[data-stage="super"] .truck-body {
      box-shadow:
        inset 0 -12px 0 rgba(116, 75, 0, 0.12),
        0 0 26px rgba(96, 215, 255, 0.34);
    }

    .truck-preview[data-stage="super"] .truck-wing,
    .truck-preview[data-stage="super"] .truck-aura {
      opacity: 1;
    }

    .truck-preview[data-stage="super"] .truck-stripe {
      background: linear-gradient(90deg, var(--mint), var(--sky), var(--violet), var(--amber));
      height: 14px;
    }

    .stage-track {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin: 16px 0 0;
    }

    .stage-dot {
      height: 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.13);
      border: 1px solid var(--line);
    }

    .stage-dot.is-lit {
      background: linear-gradient(90deg, var(--mint), var(--amber));
      box-shadow: 0 0 16px rgba(255, 200, 87, 0.28);
    }

    .reward-stage {
      margin: 14px 0 0;
      color: var(--ink);
      font-weight: 1000;
      font-size: clamp(1rem, 1.9vw, 1.22rem);
    }

    .reward-change {
      margin: 14px 0 28px;
      color: var(--muted);
      font-weight: 950;
      font-size: 1.1rem;
    }

    .result-layer {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }

    .result-dynamic-ui {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
    }

    .result-status-panel {
      display: none;
    }

    .result-power-text,
    .result-next-goal-text {
      fill: #fff8e8;
      stroke: rgba(28, 18, 12, .72);
      stroke-width: 5px;
      paint-order: stroke fill;
      text-anchor: middle;
      dominant-baseline: middle;
      font-family: "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      font-weight: 1000;
    }

    .result-power-text { font-size: 32px; }
    .result-next-goal-text { font-size: 28px; }
    .result-progress-track { fill: rgba(255, 255, 255, .2); stroke: rgba(255, 255, 255, .48); stroke-width: 2; }
    .result-progress-fill { fill: url(#resultProgressGradient); }

    #screen-result .raster-bg {
      object-fit: cover;
      object-position: center;
      opacity: 1;
      filter: none;
      mix-blend-mode: normal;
    }

    .result-title-art {
      display: none !important;
    }

    .result-correct-art {
      position: absolute;
      top: 44.5%;
      left: 70.15625%;
      width: 9.375%;
      height: 9%;
      max-height: none;
      object-fit: contain;
      transform: none;
      filter: drop-shadow(0 12px 20px rgba(0, 0, 0, 0.38));
      pointer-events: none;
    }

    .result-retry-hitbox {
      position: absolute;
      left: 65.46875%;
      top: 60%;
      width: 18.75%;
      height: 7.5%;
      min-width: 0;
      padding: 0;
      border: 0;
      background: transparent;
      transform: none;
      cursor: pointer;
      pointer-events: auto;
    }

    .result-retry-hitbox:focus-visible {
      outline: 4px solid rgba(96, 215, 255, 0.86);
      outline-offset: 4px;
      border-radius: 8px;
    }

    .result-retry-art {
      display: none !important;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @keyframes slotPulse {
      0% { filter: brightness(1); }
      45% { filter: brightness(1.34); }
      100% { filter: brightness(1); }
    }

    @media (max-width: 900px) {
      .cover-scene {
        padding: 82px 42px 66px;
      }

      .hero-copy {
        width: min(560px, 64%);
      }

      .tutorial-cards {
        gap: 10px;
      }

      .tutorial-card {
        padding: 16px;
        min-height: 220px;
      }

      .problem-grid {
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .problem-card {
        padding: 16px;
      }

      .choices-panel {
        padding: 12px;
        gap: 10px;
      }
    }

    @media (max-width: 1100px) and (max-height: 800px) {
      .reward {
        padding: calc(var(--stage-inset) + 42px) var(--stage-inset) var(--stage-inset);
      }

      .reward-card {
        width: min(760px, 92%);
        padding: 18px 24px;
      }

      .upgrade-label {
        min-height: 48px;
        margin-bottom: 8px;
        font-size: clamp(1.8rem, 4vw, 2.45rem);
        line-height: 1;
      }

      .reward-evolution-stage {
        min-height: 210px;
        padding: 8px 16px;
      }

      .reward-truck-before,
      .reward-truck-after {
        max-height: 184px;
      }

      .stage-track {
        margin-top: 8px;
      }

      .reward-stage {
        margin-top: 8px;
      }

      .reward-change {
        margin: 8px 0 12px;
      }

      #rewardNextButton {
        min-height: 48px;
      }

      .result-correct-art {
        max-height: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 1ms !important;
        transition-duration: 1ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="game" data-engine-version="mathmon-standalone-v1" data-stage-ratio="16:10" data-stage-size="1280x800" data-cover-standard="generated-title-overlay" data-cover-start-standard="generated-button-art" data-cover-start-asset="shared-canonical-v1" data-settings-standard="modal-controls" data-result-visual-standard="generated-assets" data-result-render-mode="fullscene-generated-dynamic-slots" data-play-progress-standard="stage-left-play-progress-v1" data-reward-mode="modal-art" data-reward-standard="unit5-package-modal-art-v2" data-reward-card-size="560x480" data-reward-visual-size="250x250" data-tutorial-mode="poster-two-step" data-scoreboard-enabled="false" data-mathmon-pack="base-pack" data-mathmon-id="base-02-foxmon">

  <script>
    const Lesson5PackageWeightModel = (() => {
      const TOTAL_PROBLEMS = 10;
      const MIN_TRUCK_POWER = 0;
      const MAX_TRUCK_POWER = 100;
      const BASE_CORRECT_POWER = 0;
      const TYPES_PER_RUN = [
        "addCarry",
        "addCarry",
        "addCarry",
        "addCarry",
        "subtractBorrow",
        "subtractBorrow",
        "subtractBorrow",
        "limit",
        "limit",
        "limit"
      ];
      const TRUCK_RESULTS = [
        { id: "plain", name: "평범 트럭", minPower: 0, minCorrect: 0, visualRank: 0, image: "result-truck-plain-generated.webp", titleImage: "result-truck-plain-generated.webp" },
        { id: "slight", name: "살짝 멋진 트럭", minPower: 15, minCorrect: 2, visualRank: 1, image: "result-truck-slight-generated.webp", titleImage: "result-truck-slight-generated.webp" },
        { id: "swift", name: "파란 번개 트럭", minPower: 35, minCorrect: 4, visualRank: 2, image: "result-truck-swift-generated.webp", titleImage: "result-truck-swift-generated.webp" },
        { id: "cool", name: "번쩍 멋진 트럭", minPower: 55, minCorrect: 6, visualRank: 3, image: "result-truck-cool-generated.webp", titleImage: "result-truck-cool-generated.webp" },
        { id: "gold", name: "황금 축제 트럭", minPower: 78, minCorrect: 8, visualRank: 4, image: "result-truck-gold-generated.webp", titleImage: "result-truck-gold-generated.webp" },
        { id: "super", name: "무지개 하늘 트럭", minPower: 100, minCorrect: 1, needsSuperPart: true, visualRank: 5, image: "result-truck-super-generated.webp", titleImage: "result-truck-super-generated.webp" }
      ];
      const UPGRADE_EVENTS = [
        { id: "normal", text: "트럭 힘이 늘었어요", weight: 6400, min: 6, max: 10, family: "smallUpgrade" },
        { id: "loss", text: "트럭 힘이 줄었어요", weight: 1500, min: -5, max: -2, family: "repair" },
        { id: "mega", text: "트럭 힘이 크게 늘었어요", weight: 1200, min: 14, max: 22, family: "bigUpgrade" },
        { id: "jackpot", text: "부품 상자가 크게 빛나요", weight: 500, min: 30, max: 30, family: "styleUpgrade" },
        { id: "empty", text: "이번에는 그대로예요", weight: 380, min: 0, max: 0, family: "smallOnly" },
        { id: "special", text: "무지개 부품 상자", weight: 20, min: 100, max: 100, family: "superUpgrade", superPart: true }
      ];
      const WRONG_UPGRADE_EVENT = { id: "wrong-loss", text: "트럭 힘이 줄었어요", min: -6, max: -3, family: "repair" };

      function createRng(seed = 12345) {
        let value = seed >>> 0;
        return function rng() {
          value = (value + 0x6d2b79f5) >>> 0;
          let t = value;
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      function randomInt(rng, min, max) {
        return Math.floor(rng() * (max - min + 1)) + min;
      }

      function shuffle(items, rng) {
        const copy = items.slice();
        for (let index = copy.length - 1; index > 0; index -= 1) {
          const target = Math.floor(rng() * (index + 1));
          [copy[index], copy[target]] = [copy[target], copy[index]];
        }
        return copy;
      }

      function clamp(value, min, max) {
        return Math.min(Math.max(value, min), max);
      }

      function toTotalGrams(weight) {
        return weight.kg * 1000 + weight.g;
      }

      function fromTotalGrams(total) {
        return {
          kg: Math.floor(total / 1000),
          g: total % 1000
        };
      }

      function formatGrams(value) {
        return `${value}g`;
      }

      function formatWeight(weight) {
        return `${weight.kg}kg ${weight.g}g`;
      }

      function displayWeightText(text) {
        return String(text).replace(/(\d+kg) (\d+g)/g, "$1\u00a0$2");
      }

      function uniqueChoices(values, rng) {
        const seen = new Set();
        const unique = [];
        for (const value of values) {
          if (!seen.has(value)) {
            seen.add(value);
            unique.push(value);
          }
        }
        return shuffle(unique.slice(0, 4), rng);
      }

      function makeStep(id, prompt, slot, correct, choices, confirm) {
        return { id, prompt, slot, correct, choices, confirm };
      }

      function makeAddCarry(rng, serial) {
        const left = { kg: randomInt(rng, 1, 6), g: randomInt(rng, 520, 940) };
        const right = { kg: randomInt(rng, 1, 5), g: randomInt(rng, 520, 940) };
        const gramSum = left.g + right.g;
        const kgSum = left.kg + right.kg;
        const carriedGram = fromTotalGrams(gramSum);
        const final = fromTotalGrams(toTotalGrams(left) + toTotalGrams(right));
        const noCarry = `${kgSum}kg ${gramSum}g`;
        const lowGram = formatGrams(gramSum - 1000);
        const choices1 = uniqueChoices([
          formatGrams(gramSum),
          lowGram,
          formatGrams(left.g + right.g - 100),
          formatGrams(left.g + right.g + 100)
        ], rng);
        const choices2 = uniqueChoices([
          formatWeight(carriedGram),
          formatGrams(carriedGram.g),
          `0kg ${gramSum}g`,
          `1kg ${carriedGram.g + 100}g`
        ], rng);
        const choices3 = uniqueChoices([
          formatWeight(final),
          noCarry,
          `${kgSum}kg ${final.g}g`,
          `${final.kg + 1}kg ${final.g}g`
        ], rng);
        return {
          id: `add-${serial}`,
          type: "addCarry",
          kind: "더하기 택배",
          prompt: `${formatWeight(left)} + ${formatWeight(right)}`,
          expression: `${formatWeight(left)} + ${formatWeight(right)} = ${formatWeight(final)}`,
          left,
          right,
          gramSum,
          kgSum,
          carriedGram,
          final,
          finalText: formatWeight(final),
          fitsLimit: null,
          representativeMistake: noCarry,
          steps: [
            makeStep("addGrams", "g끼리 더한 값을 골라요.", "g 합", formatGrams(gramSum), choices1, `${formatGrams(gramSum)}이 들어갔어요.`),
            makeStep("addCarry", "1000g을 1kg으로 바꿔요.", "바꾼 g", formatWeight(carriedGram), choices2, `${formatWeight(carriedGram)}이 되었어요.`),
            makeStep("addFinal", "다 더한 무게를 골라요.", "완성 무게", formatWeight(final), choices3, `${formatWeight(final)}로 보낼 수 있어요.`)
          ]
        };
      }

      function makeSubtractBorrow(rng, serial) {
        const top = { kg: randomInt(rng, 5, 9), g: randomInt(rng, 100, 420) };
        const bottom = { kg: randomInt(rng, 1, top.kg - 2), g: randomInt(rng, top.g + 160, 960) };
        const borrowedTop = { kg: top.kg - 1, g: top.g + 1000 };
        const gramDifference = borrowedTop.g - bottom.g;
        const final = fromTotalGrams(toTotalGrams(top) - toTotalGrams(bottom));
        const noBorrow = `${top.kg - bottom.kg}kg ${Math.abs(top.g - bottom.g)}g`;
        const choices1 = uniqueChoices([
          formatWeight(borrowedTop),
          `${top.kg}kg ${top.g + 1000}g`,
          `${top.kg - 1}kg ${top.g}g`,
          `${top.kg - 2}kg ${top.g + 1000}g`
        ], rng);
        const choices2 = uniqueChoices([
          formatGrams(gramDifference),
          formatGrams(Math.abs(top.g - bottom.g)),
          formatGrams(gramDifference + 100),
          formatGrams(Math.max(0, gramDifference - 100)),
          formatGrams(gramDifference + 200)
        ], rng);
        const choices3 = uniqueChoices([
          formatWeight(final),
          noBorrow,
          `${final.kg + 1}kg ${final.g}g`,
          `${final.kg}kg ${Math.min(final.g + 100, 990)}g`
        ], rng);
        return {
          id: `subtract-${serial}`,
          type: "subtractBorrow",
          kind: "빼기 택배",
          prompt: `${formatWeight(top)} - ${formatWeight(bottom)}`,
          expression: `${formatWeight(top)} - ${formatWeight(bottom)} = ${formatWeight(final)}`,
          top,
          bottom,
          borrowedTop,
          gramDifference,
          final,
          finalText: formatWeight(final),
          fitsLimit: null,
          representativeMistake: noBorrow,
          steps: [
            makeStep("borrowKg", "1kg은 1000g이에요.", "바뀐 위 무게", formatWeight(borrowedTop), choices1, `${formatWeight(borrowedTop)}로 바뀌었어요.`),
            makeStep("subtractGrams", "g끼리 뺀 값을 골라요.", "g 차", formatGrams(gramDifference), choices2, `${formatGrams(gramDifference)}이 남았어요.`),
            makeStep("subtractFinal", "다 뺀 뒤의 무게를 골라요.", "완성 무게", formatWeight(final), choices3, `${formatWeight(final)}이 남았어요.`)
          ]
        };
      }

      function makeLimit(rng, serial) {
        const box = { kg: randomInt(rng, 1, 5), g: randomInt(rng, 120, 880) };
        const wrap = { kg: randomInt(rng, 0, 2), g: randomInt(rng, 140, 920) };
        const total = fromTotalGrams(toTotalGrams(box) + toTotalGrams(wrap));
        const tied = rng() < 0.2;
        const canLoad = rng() > 0.46;
        const limitOffset = tied ? 0 : canLoad ? randomInt(rng, 80, 540) : -randomInt(rng, 80, 540);
        const limit = fromTotalGrams(clamp(toTotalGrams(total) + limitOffset, 1000, 9900));
        const fitsLimit = toTotalGrams(total) <= toTotalGrams(limit);
        const wrongTotal = fromTotalGrams(Math.max(0, toTotalGrams(box) + toTotalGrams(wrap) - 1000));
        const correctFitText = toTotalGrams(total) === toTotalGrams(limit) ? "한도와 같아요" : fitsLimit ? "실을 수 있어요" : "무거워요";
        const totalGrams = toTotalGrams(total);
        const nearbyWeights = [-1000, -500, 500, 1000, 250, -250]
          .map((offset) => totalGrams + offset)
          .filter((value) => value >= 0 && value <= 9900)
          .map((value) => formatWeight(fromTotalGrams(value)));
        const choices1 = uniqueChoices([
          formatWeight(total),
          formatWeight(wrongTotal),
          `${total.kg}kg ${Math.min(total.g + 100, 990)}g`,
          `${Math.max(total.kg - 1, 0)}kg ${total.g}g`,
          ...nearbyWeights
        ], rng);
        const choices2 = shuffle(["실을 수 있어요", "무거워요", "한도와 같아요"], rng);
        return {
          id: `limit-${serial}`,
          type: "limit",
          kind: "한도 택배",
          prompt: `${formatWeight(box)} + ${formatWeight(wrap)} · 한도 ${formatWeight(limit)}`,
          expression: `${formatWeight(total)} · 한도 ${formatWeight(limit)}: ${correctFitText}`,
          box,
          wrap,
          limit,
          final: total,
          finalText: formatWeight(total),
          fitsLimit,
          representativeMistake: fitsLimit ? "무거워요" : "실을 수 있어요",
          steps: [
            makeStep("limitTotal", "택배 무게를 골라요.", "택배 무게", formatWeight(total), choices1, `${formatWeight(total)}예요.`),
            makeStep("limitFit", "한도에 맞는 말을 골라요.", "한도 확인", correctFitText, choices2, `${correctFitText}.`)
          ]
        };
      }

      function makeProblem(type, rng, serial) {
        if (type === "addCarry") return makeAddCarry(rng, serial);
        if (type === "subtractBorrow") return makeSubtractBorrow(rng, serial);
        return makeLimit(rng, serial);
      }

      function generateRun(seed = 12345) {
        const rng = createRng(seed);
        const types = shuffle(TYPES_PER_RUN, rng);
        return types.map((type, index) => makeProblem(type, rng, index + 1));
      }

      function validateChoice(step, choice) {
        return step.correct === choice;
      }

      function pickUpgradeEvent(rng, mistakeTouched) {
        if (mistakeTouched) {
          return {
            ...WRONG_UPGRADE_EVENT,
            amount: randomInt(rng, WRONG_UPGRADE_EVENT.min, WRONG_UPGRADE_EVENT.max)
          };
        }
        let roll = Math.floor(rng() * 10000);
        for (const event of UPGRADE_EVENTS) {
          if (roll < event.weight) {
            return { ...event, amount: randomInt(rng, event.min, event.max) };
          }
          roll -= event.weight;
        }
        const fallback = UPGRADE_EVENTS[0];
        return { ...fallback, amount: randomInt(rng, fallback.min, fallback.max) };
      }

      function applyUpgrade(state, event, firstTry) {
        const before = state.truckPower;
        const beforeCorrectFirstTry = state.correctFirstTry;
        const beforeSuperPartSeen = state.superPartSeen;
        const skillPower = 0;
        const truckPower = clamp(before + event.amount, MIN_TRUCK_POWER, MAX_TRUCK_POWER);
        return {
          truckPower,
          correctFirstTry: state.correctFirstTry + (firstTry ? 1 : 0),
          superPartSeen: state.superPartSeen || Boolean(event.superPart),
          before,
          beforeCorrectFirstTry,
          beforeSuperPartSeen,
          firstTry: Boolean(firstTry),
          skillPower,
          event
        };
      }

      function getTruckResult(truckPower, correctFirstTry, superPartSeen) {
        for (let index = TRUCK_RESULTS.length - 1; index >= 0; index -= 1) {
          const result = TRUCK_RESULTS[index];
          if (result.needsSuperPart && !superPartSeen) continue;
          if (truckPower >= result.minPower && correctFirstTry >= result.minCorrect) {
            return result;
          }
        }
        return TRUCK_RESULTS[0];
      }

      function getNextTruckResult(result) {
        const index = TRUCK_RESULTS.findIndex((item) => item.id === result.id);
        return TRUCK_RESULTS[Math.min(index + 1, TRUCK_RESULTS.length - 1)];
      }

      return {
        TOTAL_PROBLEMS,
        MIN_TRUCK_POWER,
        MAX_TRUCK_POWER,
        BASE_CORRECT_POWER,
        TYPES_PER_RUN,
        TRUCK_RESULTS,
        UPGRADE_EVENTS,
        WRONG_UPGRADE_EVENT,
        createRng,
        randomInt,
        shuffle,
        clamp,
        toTotalGrams,
        fromTotalGrams,
        formatGrams,
        formatWeight,
        displayWeightText,
        generateRun,
        validateChoice,
        pickUpgradeEvent,
        applyUpgrade,
        getTruckResult,
        getNextTruckResult
      };

    function createRunSeed() {
      if (hasExplicitSeed) return requestedSeed;
      let seed;
      if (window.crypto?.getRandomValues) {

        window.crypto.getRandomValues(values);
        seed = values[0];
      } else {
        seed = Math.floor((Date.now() + Math.random() * 0xffffffff) % 0xffffffff);
      }
      if (seed === lastRunSeed) seed = (seed + 0x6d2b79f5) >>> 0;
      lastRunSeed = seed;
      return seed;
    }

    function waitForMs(milliseconds) {

    function blockTransientInput(ms = TRANSIENT_INPUT_BLOCK_MS) {
      transientInputBlockedUntil = Math.max(transientInputBlockedUntil, performance.now() + ms);
    }

    function shouldBlockTransientInput(event) {
      if (!event.isTrusted || performance.now() >= transientInputBlockedUntil) return false;
      const target = event.target;
      if (!(target instanceof Element) || !target.closest("button")) return false;
      if (target.closest(".settings-toggle")) return false;
      if (target.closest(".settings-backdrop")) return false;
      return !(event.type === "click" && event instanceof MouseEvent && event.detail === 0);
    }

    function handleTransientInput(event) {
      if (!shouldBlockTransientInput(event)) return;
      event.preventDefault();
      event.stopImmediatePropagation();
    }

    ["pointerdown", "pointerup", "mousedown", "mouseup", "click", "dblclick"].forEach((eventName) => {
      document.addEventListener(eventName, handleTransientInput, true);
    });

    function blockChoicePointerInput(ms = CHOICE_CARRY_THROUGH_BLOCK_MS) {
      choiceInputLockedUntil = Math.max(choiceInputLockedUntil, performance.now() + ms);
    }

    function shouldBlockChoiceInput(event) {
      if (!event || !event.isTrusted || performance.now() >= choiceInputLockedUntil) return false;
      return event instanceof MouseEvent && event.detail > 0;
    }

    function appendWeightRow(container, rowData, isFirst = false) {
      const row = createFormulaSpan(`weight-row${isFirst ? " is-first" : ""}${rowData.className ? ` ${rowData.className}` : ""}`);
      const operatorSpan = createFormulaSpan("weight-operator", rowData.operator || "");
      const valueSpan = createFormulaSpan("weight-value");
      const major = rowData.weight ? rowData.weight.kg : rowData.major;
      const minor = rowData.weight ? rowData.weight.g : rowData.minor;
      valueSpan.append(
        createFormulaSpan("weight-major-slot", major === "" || major == null ? "\u00a0" : String(major)),
        createFormulaSpan("weight-minor-slot", minor === "" || minor == null ? "\u00a0" : String(minor))
      );
      if (rowData.ariaLabel) row.setAttribute("aria-label", rowData.ariaLabel);
      row.append(operatorSpan, valueSpan);
      container.append(row);
    }

    function createWeightEquation(rows, result = null, annotation = null) {
      const equation = createFormulaSpan("weight-equation");
      appendWeightRow(equation, { className:"weight-columns-header", major:"kg", minor:"g", ariaLabel:"킬로그램, 그램" });
      if (annotation) appendWeightRow(equation, annotation);
      rows.forEach((row, index) => appendWeightRow(equation, row, index === 0));
      equation.append(createFormulaSpan("equation-rule"));
      if (result) {
        appendWeightRow(equation, {
          operator:"=",
          major:result.major,
          minor:result.minor,
          className:"equation-result-row",
          ariaLabel:result.ariaLabel
        });
        if (result.note) equation.append(createFormulaSpan("equation-result-note", result.note));
      }
      return equation;
    }

        button.classList.add("is-wrong");
        button.disabled = true;
        ui.feedbackLine.textContent = wrongFeedbackForStep(step);
        ui.feedbackLine.className = "feedback-line is-wrong";
        playSample("wrong");
        return;
      }

      setChoicesDisabled(true);
      button.classList.add("is-correct");
      setDisplayText(ui.answerSlot, choice);
      ui.answerSlot.classList.add("is-filled");
      setDisplayText(ui.feedbackLine, step.confirm);
      ui.feedbackLine.className = "feedback-line is-good";
      if (!state.solvedStepIds.includes(step.id)) state.solvedStepIds.push(step.id);
      renderProblemPrompt(currentProblem());
      playSample("correct");

      const isLastStep = state.stepIndex === currentProblem().steps.length - 1;
      if (isLastStep) {
        window.setTimeout(showCompletePanel, 560);
        return;
      }
      window.setTimeout(() => {
        state.stepIndex += 1;
        renderStep();
      }, 1200);
    }

    function showCompletePanel() {
      const problem = currentProblem();
      setDisplayText(ui.completeExpression, problem.expression);
      ui.completeExpression.dataset.textAlignRole = problem.type === "limit" ? "sentence" : "math";
      ui.problemGrid.classList.add("is-complete");
      ui.completePanel.classList.add("is-visible");
      setButtonDisabled(ui.truckButton, false);
      ui.truckButton.focus({ preventScroll: true });
    }

    function showReward() {
      const canShowTruck = screens.play.classList.contains("is-active")
        && ui.completePanel.classList.contains("is-visible")
        && state.rewardAppliedProblemIndex !== state.problemIndex;
      if (!canShowTruck) return;

      state.rewardAppliedProblemIndex = state.problemIndex;
      setButtonDisabled(ui.truckButton, true);

      const model = Lesson5PackageWeightModel;
      const firstTry = !state.mistakeTouched;
      const upgradeEvent = model.pickUpgradeEvent(state.rng, state.mistakeTouched);
      const upgradeResult = model.applyUpgrade({
        truckPower: state.truckPower,
        correctFirstTry: state.correctFirstTry,
        superPartSeen: state.superPartSeen
      }, upgradeEvent, firstTry);
      state.truckPower = upgradeResult.truckPower;
      state.correctFirstTry = upgradeResult.correctFirstTry;
      state.superPartSeen = upgradeResult.superPartSeen;
      state.latestUpgrade = upgradeResult;

      renderClosedReward();
      ui.rewardNextButton.textContent = state.problemIndex === state.problems.length - 1 ? "결과 보기" : "다음";
      showRewardOverlay();
      ui.rewardOpenButton.focus({ preventScroll: true });
    }

    async function advanceAfterReward() {
      const canAdvance = screens.reward.classList.contains("is-active")
        && state.latestUpgrade
        && state.rewardPhase === "opened"
        && !state.rewardTransitioning
        && state.rewardAppliedProblemIndex === state.problemIndex
        && state.rewardAdvancedProblemIndex !== state.problemIndex;
      if (!canAdvance) return;

      state.rewardAdvancedProblemIndex = state.problemIndex;
      state.rewardPhase = "idle";
      state.rewardTransitioning = true;
      ui.stageShell.dataset.rewardTransitioning = "true";
      ui.stageShell.dataset.rewardModalClosedAt = "";
      ui.stageShell.dataset.rewardEffectStartedAt = "";
      ui.stageShell.dataset.rewardEffectEndedAt = "";
      ui.stageShell.dataset.rewardAdvancedAt = "";
      setButtonDisabled(ui.rewardNextButton, true);
      blockTransientInput();

      const model = Lesson5PackageWeightModel;
      const beforeResult = model.getTruckResult(
        state.latestUpgrade.before,
        state.latestUpgrade.beforeCorrectFirstTry,
        state.latestUpgrade.beforeSuperPartSeen
      );
      const afterResult = model.getTruckResult(state.truckPower, state.correctFirstTry, state.superPartSeen);
      const movement = state.truckPower - state.latestUpgrade.before;
      const effectClass = afterResult.id !== beforeResult.id
        ? "is-tier-up"
        : movement < 0
          ? "is-dimming"
          : movement >= 14
            ? "is-celebrating"
            : "is-changing";

      screens.reward.classList.remove("is-active");
      screens.play.classList.add("is-active");
      state.screen = "play";
      ui.stageShell.dataset.activeScreen = "play";
      ui.stageShell.dataset.rewardModalClosedAt = String(performance.now());

      if (movement === 0) {
        renderProgress();
        await waitForMs(REWARD_PRE_EFFECT_DELAY_MS);
        state.rewardTransitioning = false;
        ui.stageShell.dataset.rewardTransitioning = "false";
        if (state.problemIndex === state.problems.length - 1) {
          showResult();
          ui.stageShell.dataset.rewardAdvancedAt = String(performance.now());
          return;
        }
        state.problemIndex += 1;
        renderProblem();
        ui.stageShell.dataset.rewardAdvancedAt = String(performance.now());
        blockChoicePointerInput();
        return;
      }

      await waitForMs(REWARD_PRE_EFFECT_DELAY_MS);

      ui.stageShell.dataset.rewardEffectStartedAt = String(performance.now());
      ui.truckProgressVisual.classList.remove("is-changing", "is-dimming", "is-celebrating", "is-tier-up");
      ui.truckProgressVisual.classList.add(effectClass);
      ui.progressImpactStage.classList.toggle("is-active", movement > 0);
      renderProgress();
      await waitForMs(REWARD_EFFECT_DURATION_MS);
      ui.truckProgressVisual.classList.remove("is-changing", "is-dimming", "is-celebrating", "is-tier-up");
      ui.progressImpactStage.classList.remove("is-active");
      ui.stageShell.dataset.rewardEffectEndedAt = String(performance.now());
      state.rewardTransitioning = false;
      ui.stageShell.dataset.rewardTransitioning = "false";

      if (state.problemIndex === state.problems.length - 1) {
        showResult();
        ui.stageShell.dataset.rewardAdvancedAt = String(performance.now());
        return;
      }
      state.problemIndex += 1;
      renderProblem();
      ui.stageShell.dataset.rewardAdvancedAt = String(performance.now());
      blockChoicePointerInput();
    }

    function getResultTotalProblems() {
      return typeof TOTAL_QUESTIONS === "number" ? TOTAL_QUESTIONS : (typeof TOTAL_PROBLEMS === "number" ? TOTAL_PROBLEMS : 10);
    }

    function getResultCorrectArtSrc(correctCount) {
      const total = getResultTotalProblems();
      const value = Math.max(0, Math.min(total, Math.round(Number(correctCount) || 0)));
      return `../_shared/result-count/result-correct-${value}-generated.webp`;
    }

    function applyResultLayout(result) {
      const axisX = RESULT_LAYOUT.axisXByTier[result.id] ?? RESULT_LAYOUT.axisXByTier.plain;
      const barX = axisX - RESULT_LAYOUT.barWidth / 2;
      const correctX = axisX - RESULT_LAYOUT.correctWidth / 2;
      const retryX = axisX - RESULT_LAYOUT.retryWidth / 2;

      ui.resultPowerText.setAttribute("x", String(axisX));
      ui.resultPowerText.setAttribute("y", String(RESULT_LAYOUT.measureY));
      ui.resultProgressTrack.setAttribute("x", String(barX));
      ui.resultProgressTrack.setAttribute("y", String(RESULT_LAYOUT.barY));
      ui.resultProgressTrack.setAttribute("width", String(RESULT_LAYOUT.barWidth));
      ui.resultProgressTrack.setAttribute("height", String(RESULT_LAYOUT.barHeight));
      ui.resultProgressFill.setAttribute("x", String(barX));
      ui.resultProgressFill.setAttribute("y", String(RESULT_LAYOUT.barY));
      ui.resultProgressFill.setAttribute("height", String(RESULT_LAYOUT.barHeight));
      ui.resultNextGoalText.setAttribute("x", String(axisX));
      ui.resultNextGoalText.setAttribute("y", String(RESULT_LAYOUT.nextY));

      ui.resultCorrectArt.style.left = `${correctX / 12.8}%`;
      ui.resultCorrectArt.style.top = `${RESULT_LAYOUT.correctTop / 8}%`;
      ui.resultCorrectArt.style.width = `${RESULT_LAYOUT.correctWidth / 12.8}%`;
      ui.resultCorrectArt.style.height = `${RESULT_LAYOUT.correctHeight / 8}%`;
      ui.retryButton.style.left = `${retryX / 12.8}%`;
      ui.retryButton.style.top = `${RESULT_LAYOUT.retryY / 8}%`;
      ui.retryButton.style.width = `${RESULT_LAYOUT.retryWidth / 12.8}%`;
      ui.retryButton.style.height = `${RESULT_LAYOUT.retryHeight / 8}%`;
    }

    function showResult() {
      const model = Lesson5PackageWeightModel;
      const result = model.getTruckResult(state.truckPower, state.correctFirstTry, state.superPartSeen);
      const next = model.getNextTruckResult(result);
      screens.result.dataset.resultTier = result.id;
      ui.resultBg.src = result.image;
      ui.resultTitleArt.src = result.image;
      ui.resultTitle.textContent = result.name;
      ui.resultCorrectArt.src = getResultCorrectArtSrc(state.correctFirstTry);
      applyResultLayout(result);
      ui.resultProgressFill.setAttribute("width", String(RESULT_LAYOUT.barWidth * model.clamp(state.truckPower, 0, 100) / 100));
      ui.resultPowerText.textContent = `트럭 힘 ${state.truckPower}`;
      ui.resultNextGoalText.textContent = result.id === next.id
        ? "가장 높은 트럭까지 왔어요"
        : next.needsSuperPart
          ? "다음: 무지개 부품 상자"
          : `다음 목표: 힘 ${next.minPower} · 정답 ${next.minCorrect}개`;
      ui.resultSummary.textContent = `정답 ${state.correctFirstTry}/${getResultTotalProblems()}`;
      ui.resultNext.textContent = result.id === next.id
        ? "최고 트럭이에요. 다시 만들까요?"
        : `다음엔 ${next.name}`;
      playSample("result");
      showScreen("result");
    }

    function startGame() {
      state = createInitialState(createRunSeed());
      syncSettingsUi();
      renderProblem();
    }

    window.__mathmonRunQa = {
      generateSignature() {
        startGame();
        return JSON.stringify(state.problems);
      },
      getRunSeed: () => state.seed
    };

    function syncSettingsUi() {
      ui.settingsBgmToggle.setAttribute("aria-checked", String(state.bgmEnabled));
      ui.settingsSfxToggle.setAttribute("aria-checked", String(state.sfxEnabled));
      ui.settingsButton.setAttribute("aria-expanded", String(!ui.settingsBackdrop.hidden));
    }

    function setBgmEnabled(enabled) {
      state.bgmEnabled = enabled;
      saveAudioPreference(AUDIO_PREF_KEYS.bgm, enabled);
      syncSettingsUi();
    }

    function setSfxEnabled(enabled) {
      state.sfxEnabled = enabled;
      saveAudioPreference(AUDIO_PREF_KEYS.sfx, enabled);
      syncSettingsUi();
    }

    function getFocusableSettings() {
      return Array.from(ui.settingsModal.querySelectorAll('button, [href], [tabindex]:not([tabindex="-1"])'))
        .filter((element) => !element.disabled && !element.hidden && element.offsetParent !== null);
    }

    function setRestartConfirm(confirming) {
      ui.settingsMenu.hidden = confirming;
      ui.settingsRestartConfirm.hidden = !confirming;
      window.requestAnimationFrame(() => {
        (confirming ? ui.settingsRestartCancelButton : ui.settingsBgmToggle).focus();
      });
    }

    function openSettings() {
      ui.settingsBackdrop.hidden = false;
      setRestartConfirm(false);
      syncSettingsUi();
      window.requestAnimationFrame(() => ui.settingsBgmToggle.focus());
    }

    function closeSettings(options = {}) {
      ui.settingsBackdrop.hidden = true;
      setRestartConfirm(false);
      syncSettingsUi();
      if (options.restoreFocus !== false) ui.settingsButton.focus();
    }

    function handleSettingsKeydown(event) {
      if (event.key === "Escape") {
        closeSettings();
        return;
      }
      if (event.key !== "Tab") return;
      const focusable = getFocusableSettings();
      if (!focusable.length) return;
      const first = focusable[0];
      const last = focusable[focusable.length - 1];
      if (event.shiftKey && document.activeElement === first) {
        event.preventDefault();
        last.focus();
      } else if (!event.shiftKey && document.activeElement === last) {
        event.preventDefault();
        first.focus();
      }
    }

    function renderTutorialPage(page) {
      state.tutorialPage = Math.max(0, Math.min(TUTORIAL_PAGES.length - 1, page));
      const view = TUTORIAL_PAGES[state.tutorialPage];
      ui.tutorialTitle.textContent = view.title;
      ui.tutorialStartButton.textContent = view.button;
      screens.tutorial.dataset.page = String(state.tutorialPage);
      [...ui.tutorialCards.querySelectorAll(".tutorial-card")].forEach((card, index) => {
        card.hidden = index !== state.tutorialPage;
      });
    }

    function openTutorial(reviewMode) {
      state.tutorialReviewMode = Boolean(reviewMode);
      renderTutorialPage(0);
      if (state.tutorialReviewMode) ui.tutorialStartButton.textContent = "계속하기";
      showScreen("tutorial");
    }

    function reviewTutorial() {
      state.reviewReturnScreen = state.screen || "cover";
      closeSettings({ restoreFocus: false });
      openTutorial(true);
    }

    function continueAfterTutorial() {
      if (state.tutorialReviewMode) {
        state.tutorialReviewMode = false;
        showScreen(state.reviewReturnScreen || "cover");
        return;
      }
      if (state.tutorialPage < TUTORIAL_PAGES.length - 1) {
        renderTutorialPage(state.tutorialPage + 1);
        return;
      }
      startGame();
    }

    function restartFromSettings() {
      closeSettings({ restoreFocus: false });
      state = createInitialState(createRunSeed());
      syncSettingsUi();
      showScreen("cover");
    }

    ui.startButton.addEventListener("click", () => openTutorial(false));
    ui.tutorialStartButton.addEventListener("click", continueAfterTutorial);
    ui.tutorialBackButton.addEventListener("click", () => renderTutorialPage(state.tutorialPage - 1));
    ui.truckButton.addEventListener("click", showReward);
    ui.rewardOpenButton.addEventListener("click", openReward);
    ui.rewardNextButton.addEventListener("click", advanceAfterReward);
    ui.retryButton.addEventListener("click", startGame);
    ui.settingsButton.addEventListener("click", openSettings);
    ui.settingsBackdrop.addEventListener("click", (event) => {
      if (event.target === ui.settingsBackdrop) closeSettings();
    });
    ui.settingsModal.addEventListener("keydown", handleSettingsKeydown);
    ui.settingsBgmToggle.addEventListener("click", () => setBgmEnabled(!state.bgmEnabled));
    ui.settingsSfxToggle.addEventListener("click", () => setSfxEnabled(!state.sfxEnabled));
    ui.settingsMethodButton.addEventListener("click", reviewTutorial);
    ui.settingsRestartButton.addEventListener("click", () => setRestartConfirm(true));
    ui.settingsRestartConfirmButton.addEventListener("click", restartFromSettings);
    ui.settingsRestartCancelButton.addEventListener("click", () => setRestartConfirm(false));
    ui.settingsCloseButton.addEventListener("click", () => closeSettings());

    syncSettingsUi();
    window.__mathmonAudioQa = {
      getPrefs: () => ({
        bgmEnabled: state.bgmEnabled,
        sfxEnabled: state.sfxEnabled,
        settingsOpen: !ui.settingsBackdrop.hidden
      }),
      setPrefs: (prefs) => {
        if (typeof prefs.bgmEnabled === "boolean") setBgmEnabled(prefs.bgmEnabled);
        if (typeof prefs.sfxEnabled === "boolean") setSfxEnabled(prefs.sfxEnabled);
      },
      getLog: () => state.sfxLog.slice(),
      clearLog: () => {
        state.sfxLog = [];
      }
    };
    window.Lesson5PackageWeightModel = Lesson5PackageWeightModel;
    if (hasQaMarker) {
      window.__lesson5PackageQa = {
        forceRewardEvent: (eventId) => {
          const source = Lesson5PackageWeightModel.UPGRADE_EVENTS.find((event) => event.id === eventId);
          if (!source) throw new Error(`알 수 없는 보상 사건: ${eventId}`);
          const amount = source.min === source.max ? source.min : source.min;
          const beforePower = ["normal", "loss"].includes(eventId) ? 50 : 40;
          const event = { ...source, amount };
          state.truckPower = beforePower;
          state.correctFirstTry = 5;
          state.superPartSeen = false;
          renderProblem();
          const upgradeResult = Lesson5PackageWeightModel.applyUpgrade({
            truckPower: beforePower,
            correctFirstTry: 5,
            superPartSeen: false
          }, event, true);
          state.truckPower = upgradeResult.truckPower;
          state.correctFirstTry = upgradeResult.correctFirstTry;
          state.superPartSeen = upgradeResult.superPartSeen;
          state.latestUpgrade = upgradeResult;
          state.rewardAppliedProblemIndex = state.problemIndex;
          state.rewardAdvancedProblemIndex = -1;
          renderClosedReward();
          showRewardOverlay();
          return { eventId, amount, beforePower, afterPower: state.truckPower };
        },
        openReward,
        forcePlayTier: (tierId) => {
          const result = Lesson5PackageWeightModel.TRUCK_RESULTS.find((item) => item.id === tierId);
          if (!result) throw new Error(`알 수 없는 진행 단계: ${tierId}`);
          state.truckPower = result.minPower;
          state.correctFirstTry = result.minCorrect;
          state.superPartSeen = Boolean(result.needsSuperPart);
          renderProblem();
          showScreen("play");
          return {
            tierId,
            truckPower: state.truckPower,
            correctFirstTry: state.correctFirstTry,
            superPartSeen: state.superPartSeen
          };
        },
        forceResultTier: (tierId) => {
          const result = Lesson5PackageWeightModel.TRUCK_RESULTS.find((item) => item.id === tierId);
          if (!result) throw new Error(`알 수 없는 결과 단계: ${tierId}`);
          state.truckPower = result.minPower;
          state.correctFirstTry = result.minCorrect;
          state.superPartSeen = Boolean(result.needsSuperPart);
          showResult();
          return {
            tierId,
            truckPower: state.truckPower,
            correctFirstTry: state.correctFirstTry,
            superPartSeen: state.superPartSeen
          };
        },
        getState: () => ({
          screen: state.screen,
          rewardPhase: state.rewardPhase,
          rewardTransitioning: state.rewardTransitioning,
          truckPower: state.truckPower,
          correctFirstTry: state.correctFirstTry,
          problemType: currentProblem()?.type || null,
          solvedStepIds: [...state.solvedStepIds],
          latestEventId: state.latestUpgrade?.event?.id || null
        })
      };
    }
  </script>
</body>
</html>
