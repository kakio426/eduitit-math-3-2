<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>매스몬 컴퍼스 마법진 | 에듀잇티 수학 게임</title>
  <style>
    :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body {
          margin: 0;
          min-height: 100dvh;
          display: grid;
          place-items: center;
          background: #111018;
          color: #fff8e8;
          font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
          letter-spacing: 0;
          overflow: hidden;
        }
        button { font: inherit; letter-spacing: 0; }
        .visually-hidden {
          position: absolute;
          width: 1px;
          height: 1px;
          padding: 0;
          margin: -1px;
          overflow: hidden;
          clip: rect(0, 0, 0, 0);
          white-space: nowrap;
          border: 0;
        }
        .game {
          --stage-padding: clamp(10px, 2vw, 24px);
          width: 100vw;
          height: 100dvh;
          padding: var(--stage-padding);
          display: grid;
          place-items: center;
          background:
            radial-gradient(circle at 15% 16%, rgba(96, 215, 255, 0.22), transparent 26%),
            radial-gradient(circle at 85% 84%, rgba(255, 200, 87, 0.17), transparent 28%),
            #111018;
        }
        .stage-shell {
          --stage-inset: clamp(14px, 2vw, 22px);
          --sound-button-size: clamp(42px, 3.6vw, 46px);
          --sound-gap: clamp(8px, 1vw, 12px);
          --sound-reserve: calc(var(--sound-button-size) + var(--sound-gap));
          --top-control-pad-x: 9px;
          --top-control-icon-gap: 7px;
          position: relative;
          width: min(1280px, calc((100dvh - 48px) * 1.6), 100%);
          aspect-ratio: 16 / 10;
          overflow: hidden;
          border-radius: 24px;
          box-shadow: 0 26px 70px rgba(0,0,0,.42);
          background: #201a2d;
        }
        .screen {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          min-height: auto;
          aspect-ratio: 16 / 10;
          display: none;
          overflow: hidden;
        }
        .screen.is-active { display: block; }
        .raster-bg {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          object-fit: cover;
          pointer-events: none;
          user-select: none;
        }
        .settings-toggle {
          position: absolute;
          top: var(--stage-inset);
          right: var(--stage-inset);
          width: var(--sound-button-size);
          height: var(--sound-button-size);
          font-size: 0;
          border: 1px solid rgba(255,255,255,.34);
          border-radius: 999px;
          z-index: 50;
          color: #fff8e8;
          background: rgba(14, 12, 22, .58);
          backdrop-filter: blur(12px);
          display: grid;
          place-items: center;
          cursor: pointer;
        }
        .settings-toggle::before,
        .settings-toggle::after { content: ""; }
        .settings-toggle svg {
          position: absolute;
          left: 50%;
          top: 50%;
          width: 18px;
          height: 18px;
          transform: translate(-50%, -50%);
          fill: none;
          stroke: currentColor;
          stroke-width: 2;
          stroke-linecap: round;
          stroke-linejoin: round;
        }
        .settings-toggle[aria-expanded="true"] { background: rgba(53,217,178,.34); }
        .settings-toggle:focus-visible,
        .settings-switch:focus-visible,
        .settings-action:focus-visible,
        .cover-start-button:focus-visible,
        .tutorial-back-button:focus-visible,
        .primary-button:focus-visible,
        .choice-button:focus-visible,
        .result-action-hitbox:focus-visible,
        .result-retry-hitbox:focus-visible {
          outline: 3px solid #ffc857;
          outline-offset: 3px;
        }
        .settings-backdrop {
          position: absolute;
          inset: 0;
          z-index: 60;
          display: grid;
          place-items: center;
          background: rgba(0,0,0,.38);
          backdrop-filter: blur(6px);
        }
        .settings-backdrop[hidden] { display: none; }
        .settings-modal {
          width: min(410px, 86%);
          border-radius: 18px;
          border: 1px solid rgba(255,255,255,.22);
          background: rgba(32, 26, 45, .96);
          padding: 22px;
          box-shadow: 0 28px 80px rgba(0,0,0,.48);
        }
        .settings-title { margin: 0 0 14px; font-size: 1.38rem; font-weight: 1000; }
        .settings-menu,
        .settings-confirm { display: grid; gap: 10px; }
        .settings-menu[hidden], .settings-confirm[hidden] { display: none; }
        .settings-switch, .settings-action {
          min-height: 48px;
          border: 1px solid rgba(255,255,255,.18);
          border-radius: 14px;
          color: #fff8e8;
          background: rgba(255,255,255,.08);
          padding: 0 14px;
          font-weight: 950;
          cursor: pointer;
        }
        .settings-switch { display: flex; align-items: center; justify-content: space-between; }
        .settings-switch-track {
          width: 46px;
          height: 26px;
          border-radius: 999px;
          background: rgba(255,255,255,.22);
          position: relative;
        }
        .settings-switch-track::after {
          content: "";
          position: absolute;
          left: 4px;
          top: 4px;
          width: 18px;
          height: 18px;
          border-radius: 50%;
          background: #fff8e8;
          transition: transform .18s ease;
        }
        .settings-switch[aria-checked="true"] .settings-switch-track { background: #35d9b2; }
        .settings-switch[aria-checked="true"] .settings-switch-track::after { transform: translateX(20px); }
        .settings-action.is-danger { color: #ffd6de; border-color: rgba(255,93,122,.42); }
        .settings-confirm-title { margin: 0 0 8px; font-weight: 1000; font-size: 1.1rem; }
        .settings-confirm-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .stage-shell .top-row { right: calc(var(--stage-inset) + var(--sound-reserve)); }
        .stage-shell .hud { padding-right: var(--sound-reserve); }
        .top-row {
          position: absolute;
          top: var(--stage-inset);
          left: var(--stage-inset);
          right: calc(var(--stage-inset) + var(--sound-reserve));
          height: var(--sound-button-size);
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: var(--sound-gap);
          z-index: 10;
        }
        .brand-badge,
        .unit-badge,
        .mini-badge {
          flex: 0 0 auto;
          width: fit-content;
          max-width: max-content;
          min-height: var(--sound-button-size);
          padding: 0 var(--top-control-pad-x);
          gap: var(--top-control-icon-gap);
          white-space: nowrap;
          display: inline-flex;
          align-items: center;
          border: 1px solid rgba(255,255,255,.22);
          border-radius: 999px;
          background: rgba(14, 12, 22, .52);
          color: #fff8e8;
          font-size: .78rem;
          font-weight: 950;
          backdrop-filter: blur(10px);
        }
        .brand-badge img { margin-right: 0; }
        .brand-badge--logo { gap: 8px; }
        .brand-logo { width: 28px; height: 28px; object-fit: contain; flex: 0 0 auto; }
        .badge-dot { width: 7px; height: 7px; border-radius: 50%; background: #35d9b2; box-shadow: 0 0 12px #35d9b2; }
        .unit-badge .badge-dot { background: #60d7ff; box-shadow: 0 0 12px #60d7ff; }
        .topic-badge {
          position: absolute;
          left: var(--stage-inset);
          bottom: var(--stage-inset);
          background: rgba(255, 200, 87, .18);
          border-color: rgba(255, 200, 87, .42);
          z-index: 10;
        }
        .cover::after,
        .reward::after,
        .result::after {
          content: "";
          position: absolute;
          inset: 0;
          background: linear-gradient(90deg, rgba(14,12,22,.64), rgba(14,12,22,.2) 46%, rgba(14,12,22,.24));
          pointer-events: none;
        }
        .cover-scene {
          position: absolute;
          inset: 0;
          z-index: 2;
          display: grid;
          align-items: center;
          padding-left: clamp(66px, 8vw, 116px);
          padding-top: 44px;
        }
        .hero-copy { width: min(640px, 58%); display: grid; justify-items: start; gap: 16px; }
        .hero-title-art { width: min(620px, 100%); max-height: 250px; object-fit: contain; filter: drop-shadow(0 18px 26px rgba(0,0,0,.42)); }
        .cover-goal {
          margin: 0;
          width: fit-content;
          max-width: 540px;
          padding: 10px 16px;
          border-radius: 18px;
          background: rgba(14,12,22,.58);
          border: 1px solid rgba(255,255,255,.24);
          color: #fff8e8;
          font-size: clamp(1.1rem, 2vw, 1.34rem);
          line-height: 1.25;
          font-weight: 950;
        }
        .cover-start-button {
          width: clamp(300px, 28.125vw, 360px);
          aspect-ratio: 1611 / 680;
          height: auto;
          display: grid;
          place-items: center;
          padding: 0;
          border: 0;
          background: transparent;
          cursor: pointer;
          transform-origin: center;
          transition: transform .16s ease, filter .16s ease;
        }
        .cover-start-button:hover { transform: translateY(-2px) scale(1.02); filter: brightness(1.04); }
        .cover-start-button:active { transform: translateY(1px) scale(.99); }
        .start-button-art { display: block; width: 100%; height: auto; pointer-events: none; }
        .tutorial { padding: var(--stage-inset); background: linear-gradient(135deg, #201a2d, #102839); }
        .tutorial-grid {
          position: relative;
          z-index: 2;
          height: 100%;
          display: grid;
          grid-template-rows: auto 1fr auto;
          align-items: center;
          padding: 68px 42px 32px;
          gap: 22px;
        }
        .screen-title { margin: 0; text-align: center; font-size: clamp(2rem, 4vw, 3.2rem); line-height: 1.05; font-weight: 1000; }
        .tutorial-cards { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 18px; }
        .tutorial-card {
          min-height: 230px;
          display: grid;
          align-content: center;
          gap: 12px;
          border-radius: 24px;
          border: 1px solid rgba(255,255,255,.18);
          background: rgba(255,255,255,.08);
          padding: 22px;
          text-align: center;
          box-shadow: inset 0 1px rgba(255,255,255,.18);
        }
        .card-mark { margin: 0 auto; width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: #ffc857; color: #201a2d; font-weight: 1000; }
        .tutorial-card strong { font-size: clamp(1.28rem, 2.2vw, 1.72rem); line-height: 1.18; }
        .tutorial-card p { margin: 0; color: #d7cadb; font-size: 1.02rem; line-height: 1.4; font-weight: 850; }
        .tutorial-action { display: grid; place-items: center; }

        .game[data-tutorial-mode="poster-two-step"] .tutorial { padding: 0; background: #13202a; }
        .game[data-tutorial-mode="poster-two-step"] .tutorial-grid { height: 100%; padding: 0; display: block; }
        .game[data-tutorial-mode="poster-two-step"] .tutorial-grid > .screen-title { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }
        .game[data-tutorial-mode="poster-two-step"] .tutorial-cards,
        .game[data-tutorial-mode="poster-two-step"] .tutorial-card { width: 100%; height: 100%; display: block; }
        .game[data-tutorial-mode="poster-two-step"] .tutorial-card { position: relative; min-height: 0; padding: 0; border: 0; border-radius: 0; background: transparent; box-shadow: none; }
        .game[data-tutorial-mode="poster-two-step"] .tutorial-card[hidden] { display: none; }
        .game[data-tutorial-mode="poster-two-step"] .tutorial-poster-art { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
        .game[data-tutorial-mode="poster-two-step"] .tutorial-card .card-mark,
        .game[data-tutorial-mode="poster-two-step"] .tutorial-card strong,
        .game[data-tutorial-mode="poster-two-step"] .tutorial-card p { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }
        .game[data-tutorial-mode="poster-two-step"] .tutorial-action { position: absolute; inset: 0; z-index: 8; display: block; pointer-events: none; }
        .game[data-tutorial-mode="poster-two-step"] #tutorialStartButton,
        .game[data-tutorial-mode="poster-two-step"] #tutorialBackButton { position: absolute; min-width: 0; min-height: 0; padding: 0; border: 0; border-radius: 0; color: transparent; background: transparent; box-shadow: none; font-size: 0; pointer-events: auto; }
        .game[data-tutorial-mode="poster-two-step"] #screen-tutorial[data-page="0"] #tutorialStartButton { left: 31%; bottom: 1.5%; width: 38%; height: 15%; }
        .game[data-tutorial-mode="poster-two-step"] #screen-tutorial[data-page="1"] #tutorialStartButton { left: 72%; bottom: 1%; width: 27%; height: 14%; }
        .game[data-tutorial-mode="poster-two-step"] #screen-tutorial[data-page="1"] #tutorialBackButton { left: 1%; bottom: 1%; width: 24%; height: 14%; }
        .primary-button {
          min-width: 190px;
          min-height: 72px;
          padding: 0 44px;
          border: 0;
          border-radius: 999px;
          color: #201a2d;
          background: linear-gradient(180deg, #ffe59a, #ffc857 62%, #f2a51f);
          box-shadow: 0 16px 0 rgba(103,70,15,.45), 0 22px 36px rgba(0,0,0,.28);
          font-weight: 1000;
          font-size: 1.2rem;
          cursor: pointer;
        }
        .primary-button:disabled { opacity: .55; cursor: not-allowed; transform: none; }
        .play { padding: var(--stage-inset); background: radial-gradient(circle at 70% 26%, rgba(96,215,255,.2), transparent 28%), #151320; }
        .hud {
          position: relative;
          z-index: 5;
          min-height: var(--sound-button-size);
          display: grid;
          grid-template-columns: auto minmax(260px, 1fr) auto;
          align-items: start;
          gap: 14px;
          padding-right: var(--sound-reserve);
        }
        .hud-left, .hud-right { display: flex; gap: 8px; align-items: center; }
        .progress-line {
          height: var(--sound-button-size);
          border: 1px solid rgba(255,255,255,.2);
          border-radius: 999px;
          background: rgba(255,255,255,.08);
          overflow: hidden;
          position: relative;
        }
        .progress-fill { position: absolute; inset: 0 auto 0 0; width: 0%; background: linear-gradient(90deg, #35d9b2, #ffc857); transition: width .45s ease; }
        .progress-text { position: relative; z-index: 2; height: 100%; display: grid; place-items: center; color: #fff8e8; font-size: .84rem; font-weight: 1000; text-shadow: 0 1px 4px rgba(0,0,0,.5); }
        .problem-grid {
          position: relative;
          z-index: 2;
          height: calc(100% - 54px);
          margin-top: 20px;
          display: grid;
          grid-template-columns: minmax(390px, 1.15fr) minmax(330px, .85fr);
          grid-template-rows: minmax(0, 1fr) auto;
          gap: 18px;
        }
        .problem-card,
        .step-board,
        .choices-panel,
        .complete-panel {
          border: 1px solid rgba(255,255,255,.16);
          background: rgba(32, 26, 45, .88);
          border-radius: 22px;
          box-shadow: inset 0 1px rgba(255,255,255,.12), 0 18px 34px rgba(0,0,0,.24);
        }
        .problem-card { grid-row: 1 / 3; padding: 22px; display: grid; grid-template-rows: auto auto 1fr; gap: 12px; }
        .problem-label { margin: 0; color: #ffc857; font-size: .9rem; font-weight: 1000; }
        .big-problem { margin: 0; font-size: clamp(2rem, 3.5vw, 3.25rem); line-height: 1.04; font-weight: 1000; }
        .visual-area { display: grid; place-items: center; min-height: 390px; }
        .capacity-visual { width: 100%; height: 100%; display: grid; place-items: center; }
        .bottle-wrap { display: flex; align-items: end; justify-content: center; gap: 36px; width: 100%; }
        .bottle { width: 138px; height: 330px; border: 8px solid rgba(255,255,255,.84); border-radius: 30px 30px 38px 38px; position: relative; background: rgba(255,255,255,.08); overflow: hidden; box-shadow: inset 0 0 0 3px rgba(0,0,0,.18); }
        .bottle::before { content: ""; position: absolute; left: 22px; right: 22px; top: -34px; height: 48px; border: 8px solid rgba(255,255,255,.84); border-bottom: 0; border-radius: 18px 18px 0 0; }
        .water-fill { position: absolute; left: 0; right: 0; bottom: 0; height: var(--fill); background: linear-gradient(180deg, rgba(96,215,255,.9), rgba(53,217,178,.78)); transition: height .45s ease; }
        .tick { position: absolute; left: 12px; width: 28px; height: 3px; background: rgba(255,255,255,.78); border-radius: 99px; bottom: var(--tick); }
        .bottle-label { text-align: center; margin-top: 10px; font-size: 1rem; font-weight: 1000; color: #fff8e8; }
        .compare-label { display: grid; justify-items: center; gap: 10px; }
        .mix-visual { display: grid; gap: 16px; width: 100%; max-width: 560px; }
        .mix-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; }
        .mix-cup, .scale-weight {
          min-height: 78px;
          border-radius: 18px;
          border: 1px solid rgba(255,255,255,.18);
          background: rgba(255,255,255,.09);
          display: grid;
          place-items: center;
          padding: 10px;
          font-size: clamp(1.24rem, 2.4vw, 1.92rem);
          font-weight: 1000;
          text-align: center;
        }
        .mix-symbol { font-size: 2.2rem; font-weight: 1000; color: #ffc857; }
        .mix-note { justify-self: center; padding: 10px 16px; border-radius: 999px; background: rgba(53,217,178,.16); font-weight: 1000; color: #dffff5; }
        .scale-visual { width: 100%; display: grid; place-items: center; gap: 12px; }
        .scale-beam { width: min(520px, 100%); height: 18px; border-radius: 999px; background: linear-gradient(90deg, #ffc857, #fff2b8, #ffc857); transform: rotate(var(--tilt)); transform-origin: center; transition: transform .4s ease; box-shadow: 0 12px 24px rgba(0,0,0,.22); }
        .scale-pans { width: min(560px, 100%); display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        .scale-pan { min-height: 150px; border-radius: 24px; border: 2px solid rgba(255,255,255,.24); background: rgba(255,255,255,.08); display: grid; place-items: center; padding: 14px; text-align: center; }
        .scale-pan strong { display: block; margin-bottom: 8px; color: #ffc857; }
        .step-board { padding: 18px; display: grid; grid-template-rows: auto auto minmax(90px, auto) auto; gap: 12px; }
        .step-chips { display: flex; gap: 8px; flex-wrap: wrap; min-height: 34px; }
        .step-chip { padding: 8px 10px; border-radius: 999px; background: rgba(255,255,255,.09); color: #d7cadb; font-size: .8rem; font-weight: 1000; max-width: 100%; overflow-wrap: anywhere; }
        .step-chip.is-current { background: rgba(255,200,87,.22); color: #fff8e8; }
        .step-chip.is-done { background: rgba(53,217,178,.18); color: #dffff5; }
        .instruction { margin: 0; min-height: 34px; display: grid; align-items: center; color: #fff8e8; font-size: clamp(1.08rem, 2vw, 1.42rem); line-height: 1.22; font-weight: 1000; }
        .answer-slot { min-height: 90px; border: 2px dashed rgba(255,255,255,.22); border-radius: 20px; display: grid; place-items: center; font-size: clamp(1.7rem, 3.2vw, 2.55rem); font-weight: 1000; color: #ffc857; text-align: center; padding: 8px; overflow-wrap: anywhere; }
        .answer-slot.is-filled { border-style: solid; border-color: rgba(53,217,178,.7); background: rgba(53,217,178,.12); animation: slot-pop .5s ease; }
        .feedback-line { margin: 0; min-height: 28px; color: #d7cadb; font-size: .98rem; font-weight: 900; }
        .feedback-line.is-good,
        .feedback-line[data-state="correct"] { color: #a8ffe7; }
        .feedback-line.is-wrong,
        .feedback-line[data-state="wrong"] { color: #ffd6de; }
        .choices-panel { padding: 18px; display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; align-content: center; }
        .choice-button { min-height: 82px; border: 1px solid rgba(255,255,255,.18); border-radius: 18px; color: #fff8e8; background: rgba(255,255,255,.1); font-size: clamp(1.15rem, 2vw, 1.55rem); line-height: 1.15; font-weight: 1000; cursor: pointer; padding: 8px; overflow-wrap: anywhere; }
        .choice-button.is-correct,
        .choice-button[data-state="correct"] { color: #10241d; background: #35d9b2; }
        .choice-button.is-wrong,
        .choice-button[data-state="wrong"] { color: #fff8e8; background: #ff5d7a; }
        .complete-panel { grid-column: 2; grid-row: 2; padding: 14px 18px; display: none; align-items: center; gap: 14px; grid-template-columns: 1fr auto; }
        .complete-panel.is-visible { display: grid; }
        .complete-panel.is-action-only { grid-template-columns: minmax(0, 1fr); justify-items: center; }
        .complete-panel.is-action-only .primary-button { min-width: min(240px, 100%); }
        .complete-text { margin: 0; color: #fff8e8; font-size: 1.05rem; font-weight: 1000; line-height: 1.25; overflow-wrap: anywhere; }
        .problem-grid.is-complete .choices-panel { display: none; }
        .problem-grid.is-complete .step-board { grid-template-rows: minmax(90px, 1fr); }
        .problem-grid.is-complete .step-chips,
        .problem-grid.is-complete .instruction,
        .problem-grid.is-complete .feedback-line { display: none; }
        .play-mathmon-reaction {
          position: absolute;
          z-index: 4;
          left: 18px;
          bottom: 18px;
          width: 156px;
          height: 194px;
          object-fit: contain;
          object-position: left bottom;
          pointer-events: none;
          filter: drop-shadow(0 10px 16px rgba(0,0,0,.28));
          animation: mathmon-reaction-pop .42s cubic-bezier(.2,.85,.25,1.25);
        }
        @keyframes mathmon-reaction-pop {
          from { opacity: 0; transform: translateY(18px) scale(.84); }
          to { opacity: 1; transform: translateY(0) scale(1); }
        }
        @media (prefers-reduced-motion: reduce) {
          .play-mathmon-reaction { animation: none; filter: brightness(1.08) drop-shadow(0 8px 12px rgba(0,0,0,.22)); }
        }
        .reward { background: #102839; }
        .reward-panel {
          position: absolute;
          z-index: 3;
          left: 50%;
          top: 50%;
          transform: translate(-50%, -46%);
          width: min(480px, 84%);
          min-height: 430px;
          display: grid;
          justify-items: center;
          align-content: center;
          gap: 18px;
          border-radius: 28px;
          border: 1px solid rgba(255,255,255,.2);
          background: rgba(14,12,22,.66);
          backdrop-filter: blur(10px);
          box-shadow: 0 28px 70px rgba(0,0,0,.38);
          text-align: center;
          padding: 26px;
        }
        .reward-object {

    .game[data-workbench-type="compass-opening"] .complete-text {

    .game[data-workbench-type="compass-opening"] .result-dynamic-ui #resultMeasureFillSvg { fill: #d696ff; }

    .game[data-workbench-type="compass-opening"] .result-retry-hitbox {

    }
    .game[data-workbench-type="compass-opening"] #screen-reward > .raster-bg {

    .game[data-workbench-type="compass-opening"] #screen-reward .top-row { display: none; }
    .game[data-workbench-type="compass-opening"] #screen-reward .reward-panel {

    .compass-reward-story {

    }
    .compass-reward-visual::before {

    .compass-reward-tier {

      text-shadow: 0 3px 0 #6b3a08, 0 0 18px rgba(255,211,98,.38); word-break: keep-all;

    .compass-reward-meter {

    .compass-reward-meter-fill {

    .compass-reward-copy #rewardNextButton {

    }
    .compass-reward-story[data-phase="revealed"] .compass-reward-art {
      transform: scale(1); filter: drop-shadow(0 22px 34px rgba(0,0,0,.42)) drop-shadow(0 0 28px rgba(197,102,255,.45));
    }

    .game[data-workbench-type="compass-opening"][data-tutorial-mode="poster-two-step"] .tutorial { padding: 0; background: #e8f6ef; }
    .game[data-workbench-type="compass-opening"][data-tutorial-mode="poster-two-step"] .tutorial-grid { height: 100%; padding: 0; display: block; }
    .game[data-workbench-type="compass-opening"][data-tutorial-mode="poster-two-step"] .screen-title,
    .game[data-workbench-type="compass-opening"] .tutorial-progress { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }
    .game[data-workbench-type="compass-opening"][data-tutorial-mode="poster-two-step"] .tutorial-cards,
    .game[data-workbench-type="compass-opening"][data-tutorial-mode="poster-two-step"] .tutorial-card { width: 100%; height: 100%; display: block; }
    .game[data-workbench-type="compass-opening"][data-tutorial-mode="poster-two-step"] .tutorial-card {

    }
    .game[data-workbench-type="compass-opening"][data-tutorial-mode="poster-two-step"] .tutorial-card[hidden] { display: none; }
    .game[data-workbench-type="compass-opening"][data-tutorial-mode="poster-two-step"] .tutorial-poster-art { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .game[data-workbench-type="compass-opening"][data-tutorial-mode="poster-two-step"] .tutorial-card .card-mark { display: none; }
    .game[data-workbench-type="compass-opening"][data-tutorial-mode="poster-two-step"] .tutorial-card strong,
    .game[data-workbench-type="compass-opening"][data-tutorial-mode="poster-two-step"] .tutorial-card p {
      position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0);
    }
    .game[data-workbench-type="compass-opening"][data-tutorial-mode="poster-two-step"] .tutorial-action {
      position: absolute; inset: 0; z-index: 8; display: block; pointer-events: none;
    }
    .game[data-workbench-type="compass-opening"][data-tutorial-mode="poster-two-step"] #tutorialStartButton,
    .game[data-workbench-type="compass-opening"][data-tutorial-mode="poster-two-step"] #tutorialBackButton {
      position: absolute; min-width: 0; min-height: 0; padding: 0; border: 0; border-radius: 0;
      color: transparent; background: transparent; box-shadow: none; font-size: 0; pointer-events: auto;
    }
    .game[data-workbench-type="compass-opening"] #screen-tutorial[data-page="0"] #tutorialStartButton { left: 35%; bottom: 2%; width: 30%; height: 16%; }
    .game[data-workbench-type="compass-opening"] #screen-tutorial[data-page="1"] #tutorialStartButton { left: 71%; bottom: 2%; width: 29%; height: 16%; }
    .game[data-workbench-type="compass-opening"] #screen-tutorial[data-page="1"] #tutorialBackButton { left: 1%; bottom: 2%; width: 29%; height: 16%; }

    @media (max-width: 980px) {
      .game[data-workbench-type="compass-opening"] .hud { right: calc(2% + var(--sound-reserve)); left: 2%; }
      .game[data-workbench-type="compass-opening"] .problem-grid {
        top: 68px; right: 2%; bottom: 16px; left: 30%;
        grid-template-rows: minmax(0, 1.2fr) 50px minmax(196px, 1fr); gap: 8px;
      }
      .game[data-workbench-type="compass-opening"] .problem-grid.is-complete { grid-template-rows: minmax(0, 1fr) minmax(82px, 96px); }
      .game[data-workbench-type="compass-opening"] .problem-grid.is-complete .complete-panel { min-height: 82px; }
      .game[data-workbench-type="compass-opening"] .complete-panel {
        max-height: 96px; grid-template-columns: minmax(0, 1fr) minmax(170px, 210px); gap: 12px; padding: 10px 14px;
      }
      .game[data-workbench-type="compass-opening"] .complete-panel .primary-button { min-height: 54px; }
      .game[data-workbench-type="compass-opening"] #screen-reward .reward-panel { inset: 60px 3% 3%; }
      .compass-reward-story { grid-template-columns: minmax(0, 1fr) minmax(270px, .85fr); gap: 18px; }
      .compass-reward-copy { padding: 22px; gap: 14px; }
      .compass-reward-status { min-height: 48px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .drawn-circle.is-drawing { stroke-dashoffset: 0; animation: none; }
      .attempt-arc { stroke-dashoffset: 0; animation: none; }
      .compass-rotor.is-drawing,
      .compass-rotor.is-wrong-sweep,
      .compass-confirm-svg[data-state="correct-anchor"] .proof-needle,
      .compass-confirm-svg[data-state="correct-open"] .proof-opening-band { animation: none; }
      .compass-reward-art,
      .compass-reward-meter-fill { transition: none; }
    }
  </style>
</head>
<body>
  <main class="game" data-engine-version="mathmon-engine-v1" data-stage-ratio="16:10" data-stage-size="1280x800" data-cover-standard="generated-title-overlay" data-cover-start-standard="generated-button-art" data-cover-start-asset="shared-canonical-v1" data-settings-standard="modal-controls" data-result-visual-standard="generated-assets" data-result-render-mode="hybrid-generated-dynamic" data-reward-mode="stage-reveal" data-tutorial-mode="poster-two-step" data-workbench-type="compass-opening" data-scoreboard-enabled="false">

        </svg>
      </button>
      <div class="settings-backdrop" id="settingsBackdrop" hidden>

              <button class="settings-action is-danger" id="settingsRestartConfirmButton" type="button">처음부터</button>
              <button class="settings-action" id="settingsRestartCancelButton" type="button">계속하기</button>
            </div>
          </div>
        </div>
      </div>
      <section class="screen cover is-active" id="screen-cover" aria-labelledby="coverTitle">
        <img class="raster-bg" src="cover-generated.webp" alt="">
        <div class="top-row"><div class="brand-badge brand-badge--logo"><img class="brand-logo" src="../_shared/brand/eduitit-logo-mark.png" alt="" aria-hidden="true">에듀잇티 수학 게임</div><div class="unit-badge"><span class="badge-dot" aria-hidden="true"></span>3학년 2학기 3단원</div></div>
        <div class="cover-scene"><div class="hero-copy"><h1 class="visually-hidden" id="coverTitle">매스몬 컴퍼스 마법진</h1><img class="hero-title-art" src="title-logo-generated.webp" alt="" aria-hidden="true"><p class="cover-goal">반지름만큼 컴퍼스를 벌려요.</p><button class="cover-start-button" id="startButton" type="button" aria-label="시작"><img class="start-button-art" src="../_shared/mathmon/cover-start-button/start-button-generated.webp" width="620" height="220" alt="" aria-hidden="true"></button></div></div>
        <div class="mini-badge topic-badge">컴퍼스로 원 그리기</div>
      </section>
      <section class="screen tutorial" id="screen-tutorial" aria-labelledby="tutorialTitle">

        <div class="tutorial-grid"><h2 class="screen-title" id="tutorialTitle">원을 그리기 전에</h2><div class="tutorial-cards" aria-label="게임 방법"><div class="tutorial-card"><img class="tutorial-poster-art" src="tutorial-page-1-generated.webp" alt=""><div class="card-mark">1</div><strong>어떻게 벌려요?</strong><p>반지름과 컴퍼스 벌림을 같게 맞춰요.</p></div><div class="tutorial-card"><img class="tutorial-poster-art" src="tutorial-page-2-generated.webp" alt=""><div class="card-mark">2</div><strong>무엇을 얻어요?</strong><p>10문제 뒤에 마법진 이름을 봐요.</p></div></div><div class="tutorial-action"><span class="tutorial-progress" id="tutorialProgress" aria-live="polite"></span><button class="tutorial-back-button" id="tutorialBackButton" type="button" aria-label="이전" hidden>이전</button><button class="primary-button" id="tutorialStartButton" type="button">문제 시작</button></div></div>

        <div class="problem-grid"><article class="problem-card"><p class="problem-label" id="problemKind">문제</p><h2 class="big-problem" id="problemTitle">문제</h2><div class="visual-area" id="visualArea"></div></article><section class="step-board" aria-label="현재 계산판"><div class="step-chips" id="stepChips"></div><p class="instruction" id="stepInstruction">골라요.</p><div class="answer-slot" id="answerSlot">?</div><p class="feedback-line" id="feedbackLine" aria-live="polite"></p></section><section class="choices-panel" id="choicesPanel" aria-label="선택지"></section><section class="complete-panel" id="completePanel" aria-live="polite"><p class="complete-text" id="completeExpression"></p><button class="primary-button" id="rewardButton" type="button">마법 보기</button></section></div>
        <img class="play-mathmon-reaction" id="playMathmonReaction" alt="" aria-hidden="true" hidden>
      </section>
      <section class="screen reward" id="screen-reward" aria-labelledby="rewardTitle">
        <img class="raster-bg" src="reward-event-closed-generated.webp" alt="">
        <div class="top-row"><div class="brand-badge"><span class="badge-dot" aria-hidden="true"></span>마법진 빛</div><div class="unit-badge"><span class="badge-dot" aria-hidden="true"></span>한 번만 바뀌어요</div></div>
        <div class="reward-panel"><div class="reward-object" aria-hidden="true"><div class="reward-liquid" id="rewardLiquid" style="--fill:0%"></div></div><h2 class="reward-title" id="rewardTitle">보상</h2><p class="reward-stage" id="rewardStageText">흐린 원</p><p class="reward-change" id="rewardChange">마법진 빛이 바뀌었어요.</p><button class="primary-button" id="rewardNextButton" type="button">다음</button></div>
      </section>
      <div class="reward-pop" id="rewardPop" role="dialog" aria-modal="true" aria-labelledby="modalRewardTitle" hidden>

          <div class="reward-visual" id="rewardVisual" aria-hidden="true"></div>

          <button class="primary-button reward-open-button" id="modalRewardOpenButton" type="button">열기</button>
          <button class="primary-button" id="modalRewardNextButton" type="button" hidden>다음</button>

      function clamp(value, min, max) {
        return Math.min(Math.max(value, min), max);

      function truncate(value, maxLength) {
        const textValue = String(value);
        if (textValue.length <= maxLength) return textValue;
        return `${textValue.slice(0, maxLength - 1)}…`;
      }

      function objectValue(value, key) {
        if (!value || typeof value !== "object" || Array.isArray(value)) return "";
        const propertyValue = value[key];
        if (typeof propertyValue === "string" || typeof propertyValue === "number") {
          return String(propertyValue);
        }
        return "";
      }

      function resultKind(root) {
        return root.dataset.scoreboardResultKind || "score";

      function outcomeFromRewardResult(kind, rewardResult) {
        if (kind === "box") {
          return objectValue(rewardResult, "mathmonName") || OUTCOME_LABELS.box.retry;
        }
        if (kind === "rocket") {
          const id = objectValue(rewardResult, "destinationId") || objectValue(rewardResult, "id");
          return OUTCOME_LABELS.rocket[id] || OUTCOME_LABELS.rocket.retry;
        }
        if (kind === "island") {
          const id = objectValue(rewardResult, "islandId") || objectValue(rewardResult, "id");
          return OUTCOME_LABELS.island[id] || OUTCOME_LABELS.island.retry;
        }
        if (kind === "fusion") {
          const id = objectValue(rewardResult, "gradeId") || objectValue(rewardResult, "id");
          return OUTCOME_LABELS.fusion[id] || OUTCOME_LABELS.fusion.retry;
        }
        if (OUTCOME_LABELS[kind]) {
          const id = objectValue(rewardResult, "gradeId") || objectValue(rewardResult, "destinationId") || objectValue(rewardResult, "id");
          return OUTCOME_LABELS[kind][id] || OUTCOME_LABELS[kind].retry;
        }
        return "";
      }

      function mainRecordValue(root, rewardResult, score, options = {}) {
        const kind = resultKind(root);
        if (kind === "score") return options.withPoint ? `${score}점` : String(score);
        const outcome = outcomeFromRewardResult(kind, rewardResult);
        if (outcome) return outcome;
        return options.submitted ? "기록 완료" : "준비 중";
      }

      function svgElement(tagName, attributes = {}) {
        const element = document.createElementNS(SVG_NS, tagName);

        return element;
      }

      function appendSvgText(parent, className, x, y, value, maxLength) {
        const element = svgElement("text", { class: className, x, y });
        element.textContent = maxLength ? truncate(value, maxLength) : String(value);
        parent.appendChild(element);
        return element;
      }

      function appendEmpty(list, message) {

      function appendEntry(root, list, entry, myRank, totalQuestions, rowIndex) {
        const group = svgElement("g", { class: "mathmon-scoreboard-row" });
        const y = ROW_Y[rowIndex];

        appendSvgText(group, "mathmon-scoreboard-rank", 238, y, entry.rank);
        appendSvgText(group, "mathmon-scoreboard-name", 300, y, entry.nickname, 12);
        appendSvgText(
          group,
          "mathmon-scoreboard-score",
          952,
          y,
          mainRecordValue(root, entry.rewardResult, entry.score, { submitted: true, withPoint: true }),
          10
        );
        appendSvgText(group, "mathmon-scoreboard-correct", 1052, y, `${entry.correctCount}/${totalQuestions}`);

        list.appendChild(group);
      }

      function statusText(state) {
        if (!state.apiEnabled) return "선생님이 순위 기능을 켜면 전국 순위를 볼 수 있어요.";
        if (state.loading) return "기록을 보내고 순위를 불러오고 있어요.";
        if (state.error) return "순위를 불러오지 못했어요. 조금 뒤 다시 눌러요.";
        if (state.submission) return `${state.submission.nickname} 이름으로 기록했어요.`;
        if (state.session) return "이름이 정해졌어요. 결과를 보내면 순위가 보여요.";
        return "이름 정하는 중이에요.";
      }

      function emptyText(state) {
        if (!state.apiEnabled) return "순위 기능이 켜지면 여기에 10위까지 보여요.";
        if (state.loading) return "순위를 불러오고 있어요.";
        if (state.error) return "지금은 순위를 볼 수 없어요.";
        return "이번 주 기록이 아직 없어요.";
      }

      function getMaxOffset(entryCount) {
        return Math.max(0, entryCount - VISIBLE_ROWS);
      }

      function getOffset(root, entryCount) {
        const offset = Number.parseInt(root.dataset.scoreboardListOffset || "0", 10);
        return clamp(Number.isFinite(offset) ? offset : 0, 0, getMaxOffset(entryCount));
      }

      function setOffset(root, entryCount, offset) {
        root.dataset.scoreboardListOffset = String(clamp(offset, 0, getMaxOffset(entryCount)));
      }

      function installListControls(root) {
        if (root.dataset.scoreboardListControls === "ready") return;
        const viewport = root.querySelector("[data-scoreboard-list-viewport]");
        if (!viewport) return;
        root.dataset.scoreboardListControls = "ready";

        viewport.addEventListener("wheel", (event) => {
          const state = root.__mathmonScoreboardState;
