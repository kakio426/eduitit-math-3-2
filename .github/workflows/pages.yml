name: Deploy Pages and Sync Eduitit

on:
  push:
    branches:
      - main
    paths:
      - "3-2-*/**"
      - "_shared/**"
      - "manifest.json"
      - ".nojekyll"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build static artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          rsync -a \
            --include='/.nojekyll' \
            --include='/manifest.json' \
            --include='/3-2-*/***' \
            --include='/_shared/***' \
            --exclude='*' \
            ./ _site/
          find _site -type d \( \
            -name screenshots -o \
            -name raw-chromakey -o \
            -name contact-sheets \
          \) -prune -exec rm -rf {} +
          find _site -type f \( \
            -name 'README.md' -o \
            -name 'REPORT.md' -o \
            -name '*-source.png' -o \
            -name '*-source.webp' -o \
            -name '*-source.jpg' -o \
            -name '*-source.jpeg' -o \
            -name '*-transparent-raw.png' -o \
            -name '*chromakey*.png' \
          \) -delete
          du -sh _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Sync Eduitit iframe launcher versions
        env:
          SYNC_TOKEN: ${{ secrets.EDUITIT_MATHMON_SYNC_TOKEN }}
          SYNC_URL: ${{ vars.EDUITIT_MATHMON_SYNC_URL }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::warning::EDUITIT_MATHMON_SYNC_TOKEN is not configured; skipping Eduitit launcher sync."
            exit 0
          fi
          SYNC_URL="${SYNC_URL:-https://eduitit.site/edu-materials/mathmon-launchers/sync/}"
          curl --fail --show-error --silent \
            --request POST \
            --header "Content-Type: application/json" \
            --header "X-Mathmon-Sync-Token: $SYNC_TOKEN" \
            --data "{\"repository\":\"${GITHUB_REPOSITORY}\",\"ref\":\"${GITHUB_REF}\",\"sha\":\"${GITHUB_SHA}\"}" \
            "$SYNC_URL"
