name: Deploy Pages and Sync Eduitit

on:
  push:
    branches:
      - main
    paths:
      - "3-2-*/**"
      - "_shared/**"
      - "manifest.json"
      - ".nojekyll"
      - "scripts/build-pages-artifact.mjs"
      - ".github/workflows/pages.yml"
      - "!**/screenshots/**"
      - "!**/raw-chromakey/**"
      - "!**/contact-sheets/**"
      - "!**/README.md"
      - "!**/REPORT.md"
      - "!**/PLAN.md"
      - "!**/IMAGE_PLAN.md"
      - "!**/QUALITY_AUDIT.md"
      - "!**/*-source.*"
      - "!**/*chromakey*.png"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build static artifact
        run: node scripts/build-pages-artifact.mjs --out _site --check

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retrying Pages deploy
        if: ${{ steps.deployment.outcome == 'failure' }}
        run: sleep 45

      - name: Retry deploy to GitHub Pages
        if: ${{ steps.deployment.outcome == 'failure' }}
        id: deployment_retry
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Fail if Pages deploy failed twice
        if: ${{ steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome != 'success' }}
        run: |
          echo "::error::GitHub Pages deployment failed twice."
          exit 1

      - name: Sync Eduitit iframe launcher versions
        if: ${{ steps.deployment.outcome == 'success' || steps.deployment_retry.outcome == 'success' }}
        env:
          SYNC_TOKEN: ${{ secrets.EDUITIT_MATHMON_SYNC_TOKEN }}
          SYNC_URL: ${{ vars.EDUITIT_MATHMON_SYNC_URL }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::warning::EDUITIT_MATHMON_SYNC_TOKEN is not configured; skipping Eduitit launcher sync."
            exit 0
          fi
          SYNC_URL="${SYNC_URL:-https://eduitit.site/edu-materials/mathmon-launchers/sync/}"
          curl --fail --show-error --silent \
            --request POST \
            --header "Content-Type: application/json" \
            --header "X-Mathmon-Sync-Token: $SYNC_TOKEN" \
            --data "{\"repository\":\"${GITHUB_REPOSITORY}\",\"ref\":\"${GITHUB_REF}\",\"sha\":\"${GITHUB_SHA}\"}" \
            "$SYNC_URL"
