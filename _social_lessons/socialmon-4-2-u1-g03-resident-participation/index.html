<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f2552">
  <link rel="icon" href="data:,">
  <title>소셜몬 주민 참여 길 찾기</title>
  <style>
:root {
  color-scheme: light;
  font-family: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
  --navy: #102a56;
  --navy-deep: #081b3a;
  --cream: #fff9e9;
  --paper: #fffef8;
  --teal: #1d9b91;
  --teal-dark: #08736e;
  --coral: #ff735e;
  --yellow: #ffd452;
  --green: #47a85a;
  --red: #d84d4d;
  --ink: #18304d;
  --muted: #5e6d7d;
  --line: #cad8dc;
  --shadow: 0 1.15cqw 2.5cqw rgb(7 34 63 / 18%);
}

* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  min-width: 100%;
  min-height: 100%;
  margin: 0;
}

body {
  display: grid;
  place-items: center;
  overflow: hidden;
  background: #dce9e8;
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}

button {
  font: inherit;
}

button,
[role="button"] {
  -webkit-tap-highlight-color: transparent;
}

button:focus-visible {
  outline: 0.3cqw solid #ffe173;
  outline-offset: 0.25cqw;
}

[hidden] {
  display: none !important;
}

.social-game {
  display: grid;
  width: 100vw;
  height: 100vh;
  place-items: center;
}

.stage-shell {
  position: relative;
  width: min(100vw, 160vh);
  aspect-ratio: 16 / 10;
  overflow: hidden;
  container-type: inline-size;
  background:
    radial-gradient(circle at 14% 16%, rgb(255 255 255 / 80%) 0 6%, transparent 6.3%),
    linear-gradient(150deg, #fff5ca 0%, #ddf5ed 42%, #cbe9f5 100%);
  box-shadow: 0 1.25cqw 4cqw rgb(5 27 55 / 24%);
  isolation: isolate;
}

.screen {
  position: absolute;
  inset: 0;
  z-index: 1;
  padding: 2.1cqw 2.5cqw 2.5cqw;
  overflow: hidden;
}

.screen::before {
  position: absolute;
  inset: 0;
  z-index: -1;
  content: "";
  pointer-events: none;
}

.raster-bg {
  position: absolute;
  inset: 0;
  z-index: -2;
  width: 100%;
  height: 100%;
  object-fit: cover;
  pointer-events: none;
}

.screen.is-active {
  animation: screen-in 260ms ease-out both;
}

@keyframes screen-in {
  from { opacity: 0; transform: translateY(0.7cqw); }
  to { opacity: 1; transform: none; }
}

.top-row,
.quiz-header {
  position: relative;
  z-index: 2;
  display: flex;
  align-items: center;
  min-height: 4.22cqw;
  padding-right: 6.4cqw;
  gap: 0.75cqw;
}

.brand-badge,
.unit-badge,
.question-progress {
  flex: 0 0 auto;
  width: fit-content;
  max-width: max-content;
  min-height: 3.1cqw;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 999px;
  padding: 0.42cqw 1.08cqw;
  font-weight: 850;
  line-height: 1;
  white-space: nowrap;
  box-shadow: 0 0.35cqw 0.8cqw rgb(11 44 67 / 12%);
}

.play-progress-group {
  display: flex;
  align-items: center;
  gap: 0.7cqw;
}

.trace-progress {
  min-height: var(--sound-button-size);
  display: flex;
  align-items: center;
  gap: 0.25cqw;
  padding: 0 1.1cqw;
  border: 0.16cqw solid #f4b94e;
  border-radius: 999px;
  background: #fff8d9;
  color: #704715;
  font-size: clamp(14px, 1.25cqw, 17px);
  font-weight: 900;
  font-variant-numeric: tabular-nums;
}

.brand-badge {
  gap: 0.55cqw;
  border: 0.15cqw solid rgb(255 255 255 / 72%);
  background: var(--navy);
  color: white;
  font-size: clamp(13px, 1.17cqw, 15px);
}

.socialmon-brand-mark {
  flex: 0 0 auto;
  width: 2.25cqw;
  height: 1.7cqw;
  object-fit: contain;
}

.unit-badge {
  border: 0.15cqw solid #f5c447;
  background: #fff7cd;
  color: #6c4b06;
  font-size: clamp(13px, 1.17cqw, 15px);
}

.settings-toggle {
  position: absolute;
  z-index: 20;
  top: 2.1cqw;
  right: 2.5cqw;
  width: max(44px, 4.22cqw);
  aspect-ratio: 1;
  display: grid;
  place-items: center;
  padding: 0.78cqw;
  border: 0.16cqw solid rgb(255 255 255 / 80%);
  border-radius: 50%;
  background: var(--navy);
  color: white;
  box-shadow: 0 0.45cqw 1cqw rgb(8 28 56 / 22%);
  cursor: pointer;
}

.settings-toggle:hover {
  background: #173b78;
}

.settings-toggle svg {
  width: 100%;
  height: 100%;
  fill: none;
  stroke: currentColor;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-width: 3;
}

/* Cover */
.screen-cover::before {
  background: linear-gradient(180deg, rgb(255 255 255 / 5%), rgb(255 249 224 / 8%));
}

.social-game[data-component-lab="true"] .screen-cover::before {
  background:
    linear-gradient(rgb(255 255 255 / 18%), rgb(255 255 255 / 18%)),
    radial-gradient(circle at 50% 100%, #68b8aa 0 25%, transparent 25.2%),
    linear-gradient(150deg, #16366e 0 32%, #176b79 32% 61%, #e8c65e 61% 100%);
}

.cover-decoration,
.cover-decoration > span {
  position: absolute;
  pointer-events: none;
}

.cover-orbit {
  border: 0.25cqw solid rgb(255 255 255 / 22%);
  border-radius: 50%;
}

.orbit-one { width: 28cqw; height: 28cqw; left: -10cqw; bottom: -9cqw; }
.orbit-two { width: 22cqw; height: 22cqw; right: -5cqw; top: 9cqw; }
.cover-pin { width: 1.1cqw; height: 1.1cqw; border-radius: 50%; background: var(--yellow); box-shadow: 0 0 0 0.45cqw rgb(255 212 82 / 24%); }
.pin-one { left: 16%; top: 42%; }
.pin-two { right: 13%; bottom: 22%; }

.cover-content {
  position: absolute;
  inset: 9.2cqw 13cqw 3cqw;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
}

.series-kicker,
.panel-eyebrow,
.question-kind {
  margin: 0;
  color: var(--teal-dark);
  font-weight: 900;
  letter-spacing: 0.09em;
}

.series-kicker {
  color: #ffeaa0;
  font-size: clamp(13px, 1.32cqw, 17px);
}

.cover-content h1 {
  max-width: 72cqw;
  margin: 0.85cqw 0 0;
  padding: 0.08em 0 0.14em;
  color: white;
  font-size: clamp(42px, 5.7cqw, 73px);
  line-height: 1.05;
  letter-spacing: -0.045em;
  text-shadow: 0 0.5cqw 0 #0b224b, 0 0.9cqw 1.6cqw rgb(4 20 45 / 28%);
  overflow-wrap: anywhere;
}

.social-game[data-component-lab="false"] .cover-decoration {
  display: none;
}

.social-game[data-component-lab="false"] .series-kicker {
  color: var(--teal-dark);
  text-shadow: 0 0.15cqw 0 rgb(255 255 255 / 72%);
}

.social-game[data-component-lab="false"] .cover-content h1 {
  max-width: 60cqw;
  color: var(--navy);
  text-shadow: 0 0.25cqw 0 white, 0 0.65cqw 1.25cqw rgb(108 72 22 / 18%);
}

.social-game[data-component-lab="false"] .cover-goal {
  color: var(--navy);
  text-shadow: 0 0.12cqw 0 white;
}

.cover-goal {
  width: min(60cqw, 760px);
  margin: 1.15cqw 0 0;
  color: white;
  font-size: clamp(19px, 2cqw, 26px);
  font-weight: 760;
  line-height: 1.4;
  text-align: center;
}

.cover-start-button {
  position: relative;
  width: clamp(300px, 28.125cqw, 360px);
  aspect-ratio: 1611 / 680;
  margin-top: clamp(14px, 1.55cqw, 20px);
  padding: 0;
  border: 0;
  background: transparent;
  cursor: pointer;
  filter: drop-shadow(0 0.55cqw 0.45cqw rgb(4 24 46 / 28%));
}

.cover-start-button:hover { transform: translateY(-0.18cqw); }
.cover-start-button:active { transform: translateY(0.12cqw) scale(0.98); }
.start-button-art { display: block; width: 100%; height: 100%; object-fit: contain; }
.cover-copy-art { display: block; max-width: 100%; height: auto; object-fit: contain; }

/* Tutorial */
.screen-tutorial::before {
  background:
    linear-gradient(90deg, transparent 0 48%, rgb(255 255 255 / 18%) 48% 52%, transparent 52%),
    linear-gradient(150deg, #ddf4eb, #fcf0bd);
}

.tutorial-panel {
  width: 76cqw;
  min-height: 43cqw;
  margin: 1.1cqw auto 0;
  padding: 3cqw 4cqw 2.4cqw;
  border: 0.22cqw solid #fff;
  border-radius: 2.3cqw;
  background: rgb(255 254 248 / 94%);
  box-shadow: var(--shadow);
  text-align: center;
}

.tutorial-poster-art {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.panel-eyebrow,
.question-kind {
  font-size: clamp(13px, 1.18cqw, 15px);
}

.tutorial-panel h2,
.result-panel h2 {
  margin: 0.65cqw auto 1.5cqw;
  color: var(--navy);
  font-size: clamp(28px, 3cqw, 39px);
  line-height: 1.18;
}

.tutorial-steps {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 1.2cqw;
  margin: 0;
  padding: 0;
  list-style: none;
  counter-reset: tutorial-step;
}

.tutorial-steps li {
  counter-increment: tutorial-step;
  min-height: 10.4cqw;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0.7cqw;
  padding: 1.15cqw;
  border: 0.16cqw solid #c8ded9;
  border-radius: 1.35cqw;
  background: white;
  color: var(--ink);
  font-size: clamp(16px, 1.55cqw, 20px);
  font-weight: 790;
  line-height: 1.35;
}

.tutorial-steps li::before {
  content: counter(tutorial-step);
  width: 3.35cqw;
  aspect-ratio: 1;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--teal);
  color: white;
  font-weight: 900;
}

.tutorial-reward {
  max-width: 58cqw;
  min-height: 4.8cqw;
  display: flex;
  align-items: center;
  margin: 1.35cqw auto;
  padding: 0.75cqw 1.2cqw;
  border-radius: 1cqw;
  background: #fff4cc;
  color: #59400b;
  font-size: clamp(15px, 1.36cqw, 18px);
  font-weight: 700;
  line-height: 1.4;
  text-align: left;
}

.action-button,
.workbench-submit,
.sequence-reset {
  min-width: 12cqw;
  min-height: max(44px, 4.3cqw);
  padding: 0.75cqw 1.75cqw;
  border: 0.16cqw solid #08736e;
  border-radius: 999px;
  background: var(--teal);
  color: white;
  font-size: clamp(16px, 1.48cqw, 19px);
  font-weight: 900;
  line-height: 1.1;
  box-shadow: 0 0.38cqw 0 #08736e, 0 0.65cqw 1cqw rgb(8 62 72 / 16%);
  cursor: pointer;
}

.action-button:hover,
.workbench-submit:hover { background: #25aea2; }
.action-button:active,
.workbench-submit:active { transform: translateY(0.2cqw); box-shadow: 0 0.18cqw 0 #08736e; }
.action-button:disabled,
.workbench-submit:disabled { opacity: 0.45; cursor: not-allowed; box-shadow: none; }

/* Quiz */
.screen-play::before {
  background:
    radial-gradient(circle at 6% 92%, rgb(23 151 137 / 12%) 0 10%, transparent 10.2%),
    linear-gradient(145deg, #edf9f4 0 50%, #fff3cc 100%);
}

.quiz-header {
  justify-content: space-between;
}

.quiz-header-left {
  display: flex;
  align-items: center;
  gap: 0.75cqw;
}

.question-progress {
  margin-right: 0;
  border: 0.16cqw solid #b4cecb;
  background: white;
  color: var(--navy);
  font-size: clamp(15px, 1.36cqw, 18px);
  font-variant-numeric: tabular-nums;
}

.question-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 24cqw;
  gap: 1.4cqw;
  height: 51.4cqw;
  margin-top: 0.55cqw;
}

.play-work-area {
  display: contents;
}

.discovery-panel {
  display: none;
}

.question-layout:not(.has-feedback) .question-card {
  grid-column: 1 / -1;
}

.question-card,
.feedback-panel {
  min-width: 0;
  min-height: 0;
  overflow: hidden;
  border: 0.18cqw solid rgb(255 255 255 / 88%);
  border-radius: 1.65cqw;
  background: rgb(255 255 255 / 94%);
  box-shadow: 0 0.75cqw 1.8cqw rgb(23 67 75 / 14%);
}

.question-card {
  display: flex;
  flex-direction: column;
  padding: 1.45cqw 2.1cqw 1.55cqw;
}

.question-prompt {
  max-width: 88cqw;
  margin: 0.45cqw 0 0;
  color: var(--navy);
  font-size: clamp(23px, 2.25cqw, 29px);
  line-height: 1.3;
  text-align: left;
  overflow-wrap: anywhere;
}

.question-instruction {
  margin: 0.42cqw 0 0;
  color: var(--muted);
  font-size: clamp(14px, 1.32cqw, 17px);
  font-weight: 650;
  line-height: 1.35;
  text-align: left;
}

.question-workbench {
  min-height: 0;
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
  justify-content: center;
  margin-top: 0.85cqw;
  overflow: hidden;
}

.feedback-panel {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: stretch;
  padding: 2cqw;
  background: #fff9dd;
}

.feedback-panel.is-correct { border-color: #5dbd70; background: #effbea; }
.feedback-panel.is-wrong { border-color: #e87676; background: #fff0ec; }

.feedback-panel strong {
  color: var(--navy);
  font-size: clamp(24px, 2.3cqw, 30px);
  text-align: center;
}

.feedback-panel p {
  margin: 1cqw 0 1.6cqw;
  color: var(--ink);
  font-size: clamp(15px, 1.4cqw, 18px);
  font-weight: 680;
  line-height: 1.5;
  text-align: left;
  overflow-wrap: anywhere;
}

.trace-continue-button { width: 100%; }

.workbench-actions {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 1cqw;
  margin-top: 1.1cqw;
}

.choice-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 1.05cqw;
}

.choice-option,
.pair-option,
.classify-target,
.sequence-item {
  min-width: 0;
  min-height: max(52px, 5.1cqw);
  border: 0.16cqw solid #b6d2d0;
  border-radius: 1.05cqw;
  background: #f7fffd;
  color: var(--ink);
  font-size: clamp(16px, 1.58cqw, 20px);
  font-weight: 800;
  line-height: 1.3;
  cursor: pointer;
  overflow-wrap: anywhere;
}

.choice-option.has-image {
  min-height: max(92px, 8.5cqw);
  display: grid;
  grid-template-columns: minmax(6.5cqw, 0.42fr) minmax(0, 1fr);
  align-items: center;
  gap: 0.85cqw;
  padding: 0.7cqw;
  text-align: left;
}

.option-image {
  width: 100%;
  max-height: 6.5cqw;
  border-radius: 0.65cqw;
  object-fit: cover;
}

.choice-option:hover,
.pair-option:hover,
.classify-target:hover,
.sequence-item:hover { border-color: var(--teal); background: #e9fbf7; }

.choice-option[aria-pressed="true"],
.pair-option[aria-pressed="true"],
.classify-target[aria-pressed="true"],
.sequence-item[aria-pressed="true"] {
  border-color: var(--navy);
  background: #dfeaff;
  box-shadow: inset 0 0 0 0.18cqw var(--navy);
}

.source-card,
.situation-card {
  width: min(78cqw, 100%);
  max-width: 78cqw;
  margin: 0 auto 0.85cqw;
  padding: 1.15cqw 1.45cqw;
  border-left: 0.55cqw solid var(--coral);
  border-radius: 0.8cqw;
  background: #fff7e7;
  color: var(--ink);
  font-size: clamp(15px, 1.42cqw, 18px);
  font-weight: 650;
  line-height: 1.45;
  text-align: left;
  overflow-wrap: anywhere;
}

.source-card.has-image {
  display: grid;
  grid-template-columns: 14cqw minmax(0, 1fr);
  align-items: center;
  gap: 1.15cqw;
  padding: 0.8cqw 1.15cqw;
}

.source-image {
  display: block;
  width: 14cqw;
  aspect-ratio: 224 / 143;
  border: 0.12cqw solid rgb(16 42 86 / 18%);
  border-radius: 0.7cqw;
  object-fit: cover;
}

.source-copy {
  min-width: 0;
  display: flex;
  flex-direction: column;
}

.source-credit {
  display: block;
  margin-top: 0.45cqw;
  color: var(--muted);
  font-size: clamp(11px, 0.98cqw, 13px);
  font-weight: 650;
  line-height: 1.3;
}

.source-card strong,
.situation-card strong { display: block; margin-bottom: 0.35cqw; color: #93402f; }

.map-hotspot-card.has-image {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.55cqw;
}

.map-hotspot-copy {
  width: 100%;
}

.map-hotspot-board {
  position: relative;
  width: min(63cqw, 100%);
  aspect-ratio: 150 / 62;
  overflow: hidden;
  border: 0.16cqw solid rgb(16 42 86 / 22%);
  border-radius: 0.9cqw;
  background: #eaf5f4;
  box-shadow: 0 0.35cqw 0.9cqw rgb(43 51 77 / 16%);
  isolation: isolate;
}

.map-hotspot-image {
  width: 100%;
  height: 100%;
  aspect-ratio: auto;
  border: 0;
  border-radius: inherit;
  object-fit: contain;
  user-select: none;
}

.map-hotspot-target {
  position: absolute;
  z-index: 2;
  left: var(--map-hotspot-x);
  top: var(--map-hotspot-y);
  width: max(42px, 4cqw);
  height: max(42px, 4cqw);
  display: grid;
  place-items: center;
  padding: 0;
  transform: translate(-50%, -50%);
  border: max(3px, 0.24cqw) solid white;
  border-radius: 50%;
  background: #176f91;
  color: white;
  box-shadow: 0 0.22cqw 0.65cqw rgb(7 30 62 / 45%);
  font-size: clamp(17px, 1.75cqw, 23px);
  font-weight: 950;
  line-height: 1;
  cursor: pointer;
}

.map-hotspot-target:hover,
.map-hotspot-target:focus-visible {
  background: #0b4f78;
  outline: max(3px, 0.22cqw) solid #ffdd69;
  outline-offset: 2px;
}

.map-hotspot-target[aria-pressed="true"] {
  background: #ef6f55;
  box-shadow: 0 0 0 max(4px, 0.3cqw) #ffda68, 0 0.28cqw 0.8cqw rgb(7 30 62 / 42%);
}

/* Generated Socialmon visual profile */
.social-game[data-series-profile="socialmon-quiz-lite-contract-v3"] .cover-content {
  inset: 7.4cqw 5cqw 2cqw;
  justify-content: flex-start;
}

.social-game[data-series-profile="socialmon-quiz-lite-contract-v3"] .cover-copy-art {
  width: 78cqw;
  height: 43cqw;
  margin-bottom: -8.4cqw;
}

.social-game[data-series-profile="socialmon-quiz-lite-contract-v3"] .cover-content > .series-kicker,
.social-game[data-series-profile="socialmon-quiz-lite-contract-v3"] .cover-content > h1,
.social-game[data-series-profile="socialmon-quiz-lite-contract-v3"] .cover-content > .cover-goal,
.social-game[data-series-profile="socialmon-quiz-lite-contract-v3"] .tutorial-panel > .panel-eyebrow,
.social-game[data-series-profile="socialmon-quiz-lite-contract-v3"] .tutorial-panel > h2,
.social-game[data-series-profile="socialmon-quiz-lite-contract-v3"] .tutorial-panel > .tutorial-steps,
.social-game[data-series-profile="socialmon-quiz-lite-contract-v3"] .tutorial-panel > .tutorial-steps > li,
.social-game[data-series-profile="socialmon-quiz-lite-contract-v3"] .tutorial-panel > .tutorial-reward {
  position: absolute !important;
  width: 1px !important;
  height: 1px !important;
  min-width: 0 !important;
  min-height: 0 !important;
  max-width: 1px !important;
  max-height: 1px !important;
  padding: 0 !important;
  margin: -1px !important;
  overflow: hidden !important;
  clip: rect(0, 0, 0, 0) !important;
  white-space: nowrap !important;
  border: 0 !important;
}

.social-game[data-series-profile="socialmon-quiz-lite-contract-v3"] .screen-tutorial {
  padding: 0;
}

.social-game[data-series-profile="socialmon-quiz-lite-contract-v3"] .screen-tutorial::before {

.result-character-stage {

}

.result-halo {

.result-character-image {

  z-index: 1;
  width: min(45cqw, 576px);
  height: min(45cqw, 576px);

    submitButton.textContent = options.submitLabel || "답 확인";
    submitButton.disabled = true;
    submitButton.addEventListener("click", () => {
      if (controller.locked || !controller.isComplete()) return;
      controller.lock();
      onSubmit(controller.getAnswer());
    });
    actions.append(submitButton);
    root.append(actions);

    controller.refreshSubmit = () => {
      submitButton.disabled = controller.locked || !controller.isComplete();
    };
    controller.submitButton = submitButton;
  };

  const lockButtons = (root) => {
    root.querySelectorAll("button").forEach((button) => {
      button.disabled = true;
    });
  };

  const renderChoice = (root, question, onSubmit) => {
    let selectedId = null;
    const controller = {
      locked: false,
      getAnswer: () => selectedId,
      isComplete: () => selectedId !== null,
      lock() {
        this.locked = true;
        lockButtons(root);
      },
      refresh() {
        root.querySelectorAll(".choice-option, .map-hotspot-target").forEach((button) => {
          button.setAttribute("aria-pressed", String(button.dataset.optionId === selectedId));
        });
        this.refreshSubmit?.();
      }
    };

    if (question.presentation === "map-hotspots") {
      const source = document.createElement("article");
      source.className = "source-card has-image map-hotspot-card";

      const copy = document.createElement("div");
      copy.className = "source-copy map-hotspot-copy";
      const title = document.createElement("strong");
      title.textContent = question.source?.title || "지도 자료";
      const text = document.createElement("span");
      text.textContent = question.source?.text || "지도 위 위치를 살펴봐요.";
      copy.append(title, text);
      if (question.source?.credit) {
        const credit = document.createElement("small");
        credit.className = "source-credit";
        credit.textContent = question.source.credit;
        copy.append(credit);
      }

      const board = document.createElement("div");
      board.className = "map-hotspot-board";
      board.dataset.mapHotspotStandard = "socialmon-source-choice-map-hotspots-v1";
      const image = document.createElement("img");
      image.className = "source-image map-hotspot-image";
      image.src = question.source?.image || "";
      image.alt = question.source?.alt || "";
      image.draggable = false;
      board.append(image);

      (question.mapHotspots || []).forEach((hotspot, index) => {
        const option = question.options.find((item) => item.id === hotspot.optionId);
        const button = document.createElement("button");
        button.type = "button";
        button.className = "map-hotspot-target";
        button.dataset.optionId = hotspot.optionId;
        button.style.setProperty("--map-hotspot-x", `${hotspot.xPercent}%`);
        button.style.setProperty("--map-hotspot-y", `${hotspot.yPercent}%`);
        button.setAttribute("aria-pressed", "false");
        button.setAttribute("aria-label", `${hotspot.label}: ${option?.text || "지도 위치"}`);
        button.textContent = String(index + 1);
        button.addEventListener("click", () => {
          if (controller.locked) return;
          selectedId = hotspot.optionId;
          controller.refresh();
        });
        board.append(button);
      });

      source.append(copy, board);
      root.append(source);
      makeSubmitArea(root, controller, onSubmit);
      controller.refresh();
      return controller;
    }

    if (question.source) {
      const source = document.createElement("article");
      source.className = "source-card";
      if (question.source.image) {
        source.classList.add("has-image");
        const image = document.createElement("img");
        image.className = "source-image";
        image.src = question.source.image;
        image.alt = question.source.alt || "";
        source.append(image);
      }
      const copy = document.createElement("div");
      copy.className = "source-copy";
      const title = document.createElement("strong");
      title.textContent = question.source.title || "자료";
      const text = document.createElement("span");
      text.textContent = question.source.text;
      copy.append(title, text);
      if (question.source.credit) {
        const credit = document.createElement("small");
        credit.className = "source-credit";
        credit.textContent = question.source.credit;
        copy.append(credit);
      }
      source.append(copy);
      root.append(source);
    }

    if (question.situation) {
      const situation = document.createElement("article");
      situation.className = "situation-card";
      situation.innerHTML = `<strong>${escapeHtml(question.situation.title || "이럴 때")}</strong>${escapeHtml(question.situation.text)}`;
      root.append(situation);
    }

    const grid = document.createElement("div");
    grid.className = "choice-grid";
    question.options.forEach((option) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "choice-option";
      button.dataset.optionId = option.id;
      button.setAttribute("aria-pressed", "false");
      if (option.image) {
        button.classList.add("has-image");
        const image = document.createElement("img");
        image.className = "option-image";
        image.src = option.image;
        image.alt = option.alt || "";
        const text = document.createElement("span");
        text.textContent = option.text;
        button.append(image, text);
      } else {
        button.textContent = option.text;
      }
      button.addEventListener("click", () => {
        if (controller.locked) return;
        selectedId = option.id;
        controller.refresh();
      });
      grid.append(button);
    });
    root.append(grid);
    makeSubmitArea(root, controller, onSubmit);
    controller.refresh();
    return controller;
  };

  const renderMatch = (root, question, onSubmit) => {
    let selectedLeftId = null;
    const pairs = {};
    const controller = {
      locked: false,
      getAnswer: () => ({ ...pairs }),
      isComplete: () => question.left.every((item) => Boolean(pairs[item.id])),
      lock() {
        this.locked = true;
        lockButtons(root);
      },
      refresh() {
        const orderByLeft = new Map(question.left.map((item, index) => [item.id, index + 1]));
        root.querySelectorAll("[data-left-id]").forEach((button) => {
          const leftId = button.dataset.leftId;
          button.setAttribute("aria-pressed", String(leftId === selectedLeftId));
          const number = button.querySelector(".pair-number");
          number.hidden = !pairs[leftId];
          number.textContent = pairs[leftId] ? String(orderByLeft.get(leftId)) : "";
        });
        root.querySelectorAll("[data-right-id]").forEach((button) => {
          const rightId = button.dataset.rightId;
          const pairedLeft = Object.keys(pairs).find((leftId) => pairs[leftId] === rightId);
          button.setAttribute("aria-pressed", String(Boolean(pairedLeft)));
          const number = button.querySelector(".pair-number");
          number.hidden = !pairedLeft;
          number.textContent = pairedLeft ? String(orderByLeft.get(pairedLeft)) : "";
        });
        this.refreshSubmit?.();
      }
    };

    const board = document.createElement("div");
    board.className = "match-board";
    const leftColumn = document.createElement("div");
    leftColumn.className = "match-column";
    question.left.forEach((item) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "pair-option";
      button.dataset.leftId = item.id;
      button.setAttribute("aria-pressed", "false");
      button.innerHTML = `<span>${escapeHtml(item.text)}</span><span class="pair-number" hidden></span>`;
      button.addEventListener("click", () => {
        if (controller.locked) return;
        selectedLeftId = item.id;
        controller.refresh();
      });
      leftColumn.append(button);
    });

    const arrow = document.createElement("div");
    arrow.className = "match-arrow";
    arrow.setAttribute("aria-hidden", "true");
    arrow.textContent = "↔";

    const rightColumn = document.createElement("div");
    rightColumn.className = "match-column";
    question.right.forEach((item) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "pair-option";
      button.dataset.rightId = item.id;
      button.setAttribute("aria-pressed", "false");
      button.innerHTML = `<span>${escapeHtml(item.text)}</span><span class="pair-number" hidden></span>`;
      button.addEventListener("click", () => {
        if (controller.locked || !selectedLeftId) return;
        Object.keys(pairs).forEach((leftId) => {
          if (pairs[leftId] === item.id) delete pairs[leftId];
        });
        pairs[selectedLeftId] = item.id;
        selectedLeftId = null;
        controller.refresh();
      });
      rightColumn.append(button);
    });

    board.append(leftColumn, arrow, rightColumn);
    root.append(board);
    makeSubmitArea(root, controller, onSubmit, { submitLabel: "짝 확인" });
    controller.refresh();
    return controller;
  };

  const renderClassify = (root, question, onSubmit) => {
    const selections = {};
    const controller = {
      locked: false,
      getAnswer: () => ({ ...selections }),
      isComplete: () => question.items.every((item) => Boolean(selections[item.id])),
      lock() {
        this.locked = true;
        lockButtons(root);
      },
      refresh() {
        root.querySelectorAll("[data-classify-item][data-group-id]").forEach((button) => {
          button.setAttribute("aria-pressed", String(selections[button.dataset.classifyItem] === button.dataset.groupId));
        });
        this.refreshSubmit?.();
      }
    };

    const board = document.createElement("div");
    board.className = "classify-board";
    question.items.forEach((item) => {
      const row = document.createElement("div");
      row.className = "classify-row";
      const label = document.createElement("span");
      label.className = "classify-item";
      label.textContent = item.text;
      row.append(label);
      question.groups.forEach((group) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "classify-target";
        button.dataset.classifyItem = item.id;
        button.dataset.groupId = group.id;
        button.setAttribute("aria-pressed", "false");
        button.textContent = group.label;
        button.addEventListener("click", () => {
          if (controller.locked) return;
          selections[item.id] = group.id;
          controller.refresh();
        });
        row.append(button);
      });
      board.append(row);
    });
    root.append(board);
    makeSubmitArea(root, controller, onSubmit, { submitLabel: "답 확인" });
    controller.refresh();
    return controller;
  };

  const renderSequence = (root, question, onSubmit) => {
    let order = [];
    const controller = {
      locked: false,
      getAnswer: () => [...order],
      isComplete: () => order.length === question.items.length,
      reset() { order = []; },
      lock() {
        this.locked = true;
        lockButtons(root);
      },
      refresh() {
        root.querySelectorAll("[data-sequence-id]").forEach((button) => {
          const index = order.indexOf(button.dataset.sequenceId);
          button.setAttribute("aria-pressed", String(index >= 0));
          const marker = button.querySelector(".sequence-order");
          marker.hidden = index < 0;
          marker.textContent = index >= 0 ? String(index + 1) : "";
        });
        this.refreshSubmit?.();
      }
    };

    const board = document.createElement("div");
    board.className = "sequence-board";
    question.items.forEach((item) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "sequence-item";
      button.dataset.sequenceId = item.id;
      button.setAttribute("aria-pressed", "false");
      button.innerHTML = `<span class="sequence-order" hidden></span><span>${escapeHtml(item.text)}</span>`;
      button.addEventListener("click", () => {
        if (controller.locked) return;
        const index = order.indexOf(item.id);
        if (index >= 0) order.splice(index, 1);
        else order.push(item.id);
        controller.refresh();
      });
      board.append(button);
    });
    root.append(board);
    makeSubmitArea(root, controller, onSubmit, { submitLabel: "순서 확인", reset: true });
    controller.refresh();
    return controller;
  };

  const registry = {
    choice: renderChoice,
    "source-choice": renderChoice,
    "situation-choice": renderChoice,
    match: renderMatch,
    classify: renderClassify,
    sequence: renderSequence
  };

  window.SocialQuizComponents = Object.freeze({
    escapeHtml,
    supportedTypes: Object.freeze(Object.keys(registry)),
    mount(root, question, options) {
      const renderer = registry[question.type];
      if (!renderer) throw new Error(`지원하지 않는 문제 형식입니다: ${question.type}`);
      root.replaceChildren();
      if (question.presentation) root.dataset.questionPresentation = question.presentation;
      else delete root.dataset.questionPresentation;
      return renderer(root, question, options.onSubmit);
    }
  });
})();

(() => {
  "use strict";

  const config = SOCIAL_QUIZ_CONFIG;
  const usesGeneratedVisualProfile = config.contractVersion === "socialmon-quiz-lite-contract-v3";
  const byId = (id) => document.getElementById(id);
  const screens = [...document.querySelectorAll("[data-screen]")];
  const kindLabels = {
    choice: "하나 고르기",
    match: "짝 잇기",
    classify: "나누어 보기",
    sequence: "순서 세우기",
    "source-choice": "자료 살펴보기",
    "situation-choice": "생각 골라보기"
  };
  const storageKeys = {
    bgm: "socialmon-audio-bgm-enabled",
    sfx: "socialmon-audio-sfx-enabled"
  };

  const readToggle = (key) => {
    try {
      const value = localStorage.getItem(key);
      return value === null ? true : value !== "false";
    } catch {
      return true;
    }
  };

  const state = {
    screen: "cover",
    questionIndex: 0,
    correctCount: 0,
    traceCount: 0,
    answerLocked: false,
    continuationLocked: false,
    selectedResultId: null,
    forcedResultId: null,
    tutorialReturn: null,
    activeController: null,
    bgmEnabled: readToggle(storageKeys.bgm),
    sfxEnabled: readToggle(storageKeys.sfx)
  };

  let lastFocusedElement = null;
  let traceTransitionTimer = null;

  const writeToggle = (key, value) => {
    try { localStorage.setItem(key, String(value)); } catch { /* storage can be unavailable */ }
  };

  const playTone = (frequency = 520, duration = 0.08) => {
    if (!state.sfxEnabled) return;
    try {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return;
      const audioContext = new AudioContextClass();
      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();
      oscillator.type = "sine";
      oscillator.frequency.value = frequency;
      gain.gain.setValueAtTime(0.06, audioContext.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + duration);
      oscillator.connect(gain).connect(audioContext.destination);
      oscillator.start();
      oscillator.stop(audioContext.currentTime + duration);
      oscillator.addEventListener("ended", () => audioContext.close(), { once: true });
    } catch { /* sound is optional */ }
  };

  const announce = (message) => {
    const liveRegion = byId("liveRegion");
    liveRegion.textContent = "";
    requestAnimationFrame(() => { liveRegion.textContent = message; });
  };

  const showScreen = (name, focusSelector) => {
    state.screen = name;
    screens.forEach((screen) => {
      const active = screen.dataset.screen === name;
      screen.hidden = !active;
      screen.classList.toggle("is-active", active);
    });
    if (focusSelector) requestAnimationFrame(() => document.querySelector(focusSelector)?.focus());
  };

  const sameObject = (actual, expected) => {
    const expectedKeys = Object.keys(expected);
    return expectedKeys.length === Object.keys(actual).length
      && expectedKeys.every((key) => actual[key] === expected[key]);
  };

  const isCorrectAnswer = (question, answer) => {
    if (["choice", "source-choice", "situation-choice"].includes(question.type)) {
      return answer === question.correctId;
    }
    if (question.type === "sequence") {
      return Array.isArray(answer)
        && answer.length === question.correctOrder.length
        && answer.every((id, index) => id === question.correctOrder[index]);
    }
    if (question.type === "match") return sameObject(answer, question.pairs);
    if (question.type === "classify") return sameObject(answer, question.answers);
    return false;
  };

  const chooseResult = () => {
    const candidateIds = config.reward.candidateResultIds;
    const forcedId = state.forcedResultId;
    state.forcedResultId = null;
    const selectedId = forcedId && candidateIds.includes(forcedId)
      ? forcedId
      : candidateIds[Math.floor(Math.random() * candidateIds.length)];
    state.selectedResultId = selectedId;
    return config.results.find((result) => result.id === selectedId);
  };

  const selectedResult = () => config.results.find((result) => result.id === state.selectedResultId)
    || chooseResult();

  const checkpointAfter = (completedCount) => config.reward.checkpoints.find((checkpoint) => checkpoint.afterQuestion === completedCount);

  const updateTraceProgress = () => {
    byId("traceCount").textContent = String(state.traceCount);
    byId("traceTotal").textContent = String(config.questions.length);
    byId("traceProgress").setAttribute("aria-label", `소셜몬 흔적 ${state.traceCount}개 중 ${config.questions.length}개`);
    const discoveryPanel = byId("discoveryPanel");
    const revealPercent = Math.max(0, Math.min(100, 100 - (state.traceCount / config.questions.length) * 100));
    discoveryPanel.dataset.traceCount = String(state.traceCount);
    discoveryPanel.style.setProperty("--trace-reveal-inset", `${revealPercent}%`);
    [...byId("discoveryFootprints").children].forEach((footprint, index) => {
      footprint.classList.toggle("is-found", index < state.traceCount);
    });
    const discoveryMessages = [
      "누가 나타날까요?",
      "모습이 조금 보이기 시작해요.",
      "그림자를 잘 살펴봐요.",
      "조금 더 선명해졌어요.",
      "특징을 찾아봐요.",
      "거의 다 보였어요.",
      "소셜몬을 만났어요!"
    ];
    byId("discoveryCopy").textContent = discoveryMessages[Math.min(state.traceCount, discoveryMessages.length - 1)];
  };

  const updateDiscoveryCharacter = () => {
    if (!state.selectedResultId) return;
    const result = selectedResult();
    byId("discoveryCharacterBase").src = result.characterImage;
    byId("discoveryCharacterColor").src = result.characterImage;
  };

  const renderQuestion = () => {
    if (traceTransitionTimer) clearTimeout(traceTransitionTimer);
    traceTransitionTimer = null;
    const question = config.questions[state.questionIndex];
    if (!state.selectedResultId) chooseResult();
    updateDiscoveryCharacter();
    state.answerLocked = false;
    state.continuationLocked = false;
    byId("questionNumber").textContent = String(state.questionIndex + 1);
    byId("questionTotal").textContent = String(config.questions.length);
    byId("questionKind").textContent = kindLabels[question.type];
    byId("questionPrompt").textContent = question.prompt;
    byId("questionInstruction").textContent = question.instruction;
    const playSourceCredit = byId("playSourceCredit");
    playSourceCredit.textContent = question.source?.credit || "";
    playSourceCredit.hidden = !(config.contractVersion === "socialmon-quiz-lite-contract-v3" && question.source?.credit);
    byId("feedbackPanel").hidden = true;
    byId("feedbackPanel").className = "feedback-panel";
    byId("questionLayout").classList.remove("has-feedback");
    byId("playWorkArea").classList.remove("has-feedback");
    byId("traceToast").hidden = true;
    byId("traceRevealModal").hidden = true;
    updateTraceProgress();
    state.activeController = window.SocialQuizComponents.mount(byId("questionWorkbench"), question, {
      onSubmit: (answer) => submitAnswer(question, answer)
    });
    showScreen("play", ".question-workbench button");
    announce(`${state.questionIndex + 1}번 문제`);
  };

  const submitAnswer = (question, answer) => {
    if (state.answerLocked) return;
    state.answerLocked = true;
    const correct = isCorrectAnswer(question, answer);
    if (correct) state.correctCount += 1;

    const feedback = byId("feedbackPanel");
    feedback.hidden = false;
    feedback.classList.add(correct ? "is-correct" : "is-wrong");
    byId("feedbackLabel").textContent = correct ? "맞았어요!" : "아쉬워요.";
    byId("feedbackText").textContent = question.explanation;
    const completedCount = state.questionIndex + 1;
    const checkpoint = checkpointAfter(completedCount);
    byId("continueButton").textContent = completedCount === config.questions.length
      ? "소셜몬 만나기"
      : checkpoint ? "흔적 보기" : "다음 문제";
    byId("questionLayout").classList.add("has-feedback");
    byId("playWorkArea").classList.add("has-feedback");
    playTone(correct ? 660 : 240, correct ? 0.12 : 0.1);
    announce(correct ? "맞았어요. 설명을 살펴보세요." : "아쉬워요. 설명을 살펴보세요.");
    requestAnimationFrame(() => byId("continueButton").focus());
  };

  const showTraceCheckpoint = (checkpoint) => {
    const result = selectedResult();
    const card = byId("traceRevealCard");
    card.dataset.phase = checkpoint.phase;
    byId("traceRevealStep").textContent = checkpoint.label;
    byId("traceRevealTitle").textContent = checkpoint.title;
    byId("traceCharacterImage").src = result.characterImage;
    byId("traceCharacterImage").alt = checkpoint.phase === "trait" ? "소셜몬 그림자" : "아직 이름을 모르는 소셜몬 그림자";
    byId("traceRevealCopy").textContent = checkpoint.phase === "trait" ? result.trait : checkpoint.copy;
    byId("traceRevealModal").hidden = false;
    byId("traceRevealNextButton").focus();
    announce(`${checkpoint.label}. ${checkpoint.phase === "trait" ? result.trait : checkpoint.title}`);
  };

  const renderResult = (previewResultId = null) => {
    const result = (previewResultId && config.results.find((candidate) => candidate.id === previewResultId)) || selectedResult();
    byId("resultTitle").textContent = result.name;
    byId("resultCorrect").textContent = `${config.questions.length}문제 중 ${state.correctCount}문제 정답`;
    byId("resultDiscovery").textContent = config.reward.discoveryText;
    byId("resultCharacterImage").src = result.characterImage;
    byId("resultCharacterImage").alt = `${result.name} 캐릭터`;
    showScreen("result", "#restartButton");
    announce(`${result.name}을 만났어요.`);
  };

  const moveToNextQuestionOrResult = () => {
    byId("traceRevealModal").hidden = true;
    if (state.questionIndex + 1 < config.questions.length) {
      state.questionIndex += 1;
      renderQuestion();
    } else {
      renderResult();
    }
  };

  const continueAfterFeedback = () => {
    if (!state.answerLocked || state.continuationLocked) return;
    state.continuationLocked = true;
    state.traceCount = state.questionIndex + 1;
    updateTraceProgress();
    const toast = byId("traceToast");
    toast.hidden = false;
    byId("traceToastLabel").textContent = `소셜몬 흔적 ${state.traceCount}개!`;
    playTone(720, 0.1);
    announce(`소셜몬 흔적 ${state.traceCount}개를 찾았어요.`);
    const checkpoint = checkpointAfter(state.traceCount);
    traceTransitionTimer = setTimeout(() => {
      traceTransitionTimer = null;
      toast.hidden = true;
      if (checkpoint) showTraceCheckpoint(checkpoint);
      else moveToNextQuestionOrResult();
    }, config.reward.stampDurationMs);
  };

  const resetGame = () => {
    if (traceTransitionTimer) clearTimeout(traceTransitionTimer);
    traceTransitionTimer = null;
    state.questionIndex = 0;
    state.correctCount = 0;
    state.traceCount = 0;
    state.answerLocked = false;
    state.continuationLocked = false;
    state.selectedResultId = null;
    state.tutorialReturn = null;
    byId("traceToast").hidden = true;
    byId("traceRevealModal").hidden = true;
    byId("settingsModal").hidden = true;
    byId("discoveryCharacterBase").removeAttribute("src");
    byId("discoveryCharacterColor").removeAttribute("src");
    updateTraceProgress();
    showScreen("cover", "#startButton");
  };

  const openSettings = () => {
    lastFocusedElement = document.activeElement;
    byId("settingsModal").hidden = false;
    byId("settingsClose").focus();
  };

  const closeSettings = () => {
    byId("settingsModal").hidden = true;
    lastFocusedElement?.focus?.();
  };

  const updateToggleUi = () => {
    byId("bgmToggle").setAttribute("aria-checked", String(state.bgmEnabled));
    byId("sfxToggle").setAttribute("aria-checked", String(state.sfxEnabled));
  };

  const showTutorial = (returnScreen = null) => {
    state.tutorialReturn = returnScreen;
    const label = usesGeneratedVisualProfile
      ? (config.tutorial.actionLabel || "알겠어요")
      : (returnScreen ? "계속하기" : "문제 시작");
    byId("tutorialStartButton").textContent = label;
    byId("tutorialStartButton").setAttribute("aria-label", returnScreen ? "방법을 닫고 계속하기" : label);
    showScreen("tutorial", "#tutorialStartButton");
  };

  const bindStaticUi = () => {
    document.title = config.title;
    byId("coverTitle").textContent = config.title;
    byId("coverGoal").textContent = config.goal;
    ["coverUnitBadge", "tutorialUnitBadge", "playUnitBadge", "resultUnitBadge"].forEach((id) => {
      byId(id).textContent = config.unitBadge;
    });
    byId("tutorialTitle").textContent = config.tutorial.title;
    byId("tutorialSteps").replaceChildren(...config.tutorial.steps.map((step) => {
      const item = document.createElement("li");
      item.textContent = step;
      return item;
    }));
    byId("tutorialReward").textContent = config.tutorial.rewardText;
    byId("startButtonArt").src = config.assets.startButton;
    document.querySelectorAll(".socialmon-brand-mark").forEach((image) => {
      image.hidden = !config.assets.brandMark;
      if (config.assets.brandMark) image.src = config.assets.brandMark;
    });
    const coverCopyArt = byId("coverCopyArt");
    coverCopyArt.hidden = !config.visualAssets?.coverCopyArt;
    if (config.visualAssets?.coverCopyArt) coverCopyArt.src = config.visualAssets.coverCopyArt;
    const tutorialPosterArt = byId("tutorialPosterArt");
    tutorialPosterArt.hidden = !config.assets.tutorialPoster;
    if (config.assets.tutorialPoster) tutorialPosterArt.src = config.assets.tutorialPoster;
    const playBackground = byId("playBackground");
    playBackground.hidden = !config.assets.playBackground;
    if (config.assets.playBackground) playBackground.src = config.assets.playBackground;
    const coverBackground = byId("coverBackground");
    coverBackground.hidden = !config.assets.coverBackground;
    if (config.assets.coverBackground) coverBackground.src = config.assets.coverBackground;
    const resultBackground = byId("resultBackground");
    resultBackground.hidden = !config.assets.resultBackground;
    if (config.assets.resultBackground) resultBackground.src = config.assets.resultBackground;
    updateToggleUi();
    updateTraceProgress();

    byId("startButton").addEventListener("click", () => showTutorial());
    byId("tutorialStartButton").addEventListener("click", () => {
      const returnScreen = state.tutorialReturn;
      state.tutorialReturn = null;
      if (returnScreen === "play") showScreen("play", ".question-workbench button:not(:disabled)");
      else if (returnScreen === "result") showScreen("result", "#restartButton");
      else renderQuestion();
    });
    byId("continueButton").addEventListener("click", continueAfterFeedback);
    byId("traceRevealNextButton").addEventListener("click", moveToNextQuestionOrResult);
    byId("restartButton").addEventListener("click", resetGame);
    byId("settingsToggle").addEventListener("click", openSettings);
    byId("settingsClose").addEventListener("click", closeSettings);
    byId("bgmToggle").addEventListener("click", () => {
      state.bgmEnabled = !state.bgmEnabled;
      writeToggle(storageKeys.bgm, state.bgmEnabled);
      updateToggleUi();
    });
    byId("sfxToggle").addEventListener("click", () => {
      state.sfxEnabled = !state.sfxEnabled;
      writeToggle(storageKeys.sfx, state.sfxEnabled);
      updateToggleUi();
      playTone(520, 0.06);
    });
    byId("reviewTutorialButton").addEventListener("click", () => {
      const returnScreen = state.screen === "cover" ? null : state.screen;
      closeSettings();
      showTutorial(returnScreen);
    });
    byId("resetButton").addEventListener("click", resetGame);
    byId("settingsModal").addEventListener("click", (event) => {
      if (event.target === byId("settingsModal")) closeSettings();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && !byId("settingsModal").hidden) closeSettings();
    });
  };

  bindStaticUi();

  window.__socialmonQa = Object.freeze({
    getState: () => ({
      screen: state.screen,
      questionIndex: state.questionIndex,
      correctCount: state.correctCount,
      traceCount: state.traceCount,
      answerLocked: state.answerLocked,
      continuationLocked: state.continuationLocked,
      selectedResultId: state.selectedResultId
    }),
    forceResult(id) { state.forcedResultId = id; },
    renderQuestion(index) {
      state.questionIndex = Math.max(0, Math.min(config.questions.length - 1, Number(index) || 0));
      renderQuestion();
    },
    renderResult(id) { renderResult(id); },
    setTraceCount(count) {
      state.traceCount = Math.max(0, Math.min(config.questions.length, Number(count) || 0));
      if (!state.selectedResultId) chooseResult();
      updateDiscoveryCharacter();
      updateTraceProgress();
    },
    reset: resetGame
  });
})();

  </script>
</body>
</html>
